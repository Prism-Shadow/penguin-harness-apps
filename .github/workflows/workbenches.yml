name: Workbench packages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:desks
      - run: npm test
      - name: Verify reproducible packages and published npm digests
        run: npm run release:check -- --registry --out "$RUNNER_TEMP/release"
      - name: Check packages against published GitHub release catalogs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-published-packages.sh "$RUNNER_TEMP/release/packages.json"
      - name: Reject new or modified package archives in Git
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --no-renames --name-only --diff-filter=AMT HEAD^1 HEAD -- '*.tgz' '*.zip')
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::Attach packages to the GitHub Release."
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:desks
      - run: npm run format:check
      - run: npm run typecheck
