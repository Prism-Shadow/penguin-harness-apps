name: Arcade game packages

on:
  pull_request:
    paths:
      - ".github/workflows/arcade.yml"
      - "arcade/**"
      - "plugins/aurora-drift/**"
      - "plugins/harbor-pulse/**"
      - "plugins/pelican-post/**"
      - "scripts/pack-plugin.mjs"
      - "package*.json"
  push:
    branches: [main]
    paths: ["arcade/**"]

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix arcade/upstream/qq-speed --omit=dev
      - run: npm ci --prefix arcade/upstream/pelican-bike --omit=dev
      - run: node arcade/build.mjs
      - run: npm test -- arcade/game.test.mjs
      - run: npm run pack:plugins -- aurora-drift harbor-pulse pelican-post
      - name: Check the workbenches match the source
        run: git diff --exit-code -- plugins/
