name: release

on:
  push:
    tags: ["v*"]
  # Publishes an existing Release's tarballs to npm without a new tag: only the npm job runs.
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing release tag whose tarballs go to npm, for example v2026.11.25"
        required: true
        type: string
      skip:
        description: "Package names to leave out, separated by spaces"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm

      - name: Verify the release tag and read its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Use an unreleased vYYYY.MM.DD tag, or vYYYY.MM.DD-rc.N for a prerelease."
            exit 1
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          [[ "$status" == identical || "$status" == behind ]]
          awk -v heading="## [${GITHUB_REF_NAME#v}]" '
            $0 == heading { active = 1; next }
            active && /^## / { exit }
            active { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"

      - run: npm ci --ignore-scripts
      - run: npm run build:desks
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Rebuild shipped arcade games from source
        run: |
          npm ci --prefix plugins/harbor-pulse/game --omit=dev --replace-registry-host=always
          npm ci --prefix arcade/upstream/qq-speed --omit=dev
          npm ci --prefix arcade/upstream/pelican-bike --omit=dev
          node arcade/build.mjs
          git diff --exit-code -- plugins/
      - name: Build and verify the release packages
        run: npm run release:check -- --registry --out "$RUNNER_TEMP/release"

      - name: Check integrity against earlier GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-published-packages.sh "$RUNNER_TEMP/release/packages.json"

      - name: Publish the GitHub release with the verified tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/release"
          {
            printf '\n## Packages\n\n'
            jq -r '.[] | "- `\(.name)@\(.version)`: `\(.file)`"' "$out/packages.json"
          } >> "$RUNNER_TEMP/notes.md"
          tag="$GITHUB_REF_NAME"
          # An -rc tag is a GitHub prerelease; a plain date tag is a stable release and the latest.
          if [[ "$tag" == *-rc.* ]]; then
            prerelease=true
            kind=(--prerelease --latest=false)
          else
            prerelease=false
            kind=(--prerelease=false --latest)
          fi
          if ! gh release view "$tag" --json id > /dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft "${kind[@]}" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release view "$tag" --json isDraft,isPrerelease,assets > "$RUNNER_TEMP/state.json"
          jq -e --argjson expected "$prerelease" '.isPrerelease == $expected' "$RUNNER_TEMP/state.json"
          mkdir -p "$RUNNER_TEMP/downloaded"
          for file in "$out"/*.tgz "$out/packages.json"; do
            name=$(basename "$file")
            if ! jq -e --arg name "$name" 'any(.assets[]; .name == $name)' "$RUNNER_TEMP/state.json" > /dev/null; then
              jq -e '.isDraft' "$RUNNER_TEMP/state.json"
              gh release upload "$tag" "$file"
            fi
            gh release download "$tag" --pattern "$name" --dir "$RUNNER_TEMP/downloaded"
            cmp "$file" "$RUNNER_TEMP/downloaded/$name"
          done
          jq -r '(.[].file), "packages.json"' "$out/packages.json" | LC_ALL=C sort > "$RUNNER_TEMP/expected"
          gh release view "$tag" --json assets --jq '.assets[].name' | LC_ALL=C sort > "$RUNNER_TEMP/attached"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/attached"
          if jq -e '.isDraft' "$RUNNER_TEMP/state.json" > /dev/null; then
            gh release edit "$tag" --draft=false "${kind[@]}"
          fi

  # npm serves the very tarballs the Release carries, so the plugin index pins one sha512 for both
  # channels. Skipped until the repository variable NPM_TRUSTED_PUBLISHING is 'true': trusted
  # publishing cannot create a name, so each package is first published once by hand from a
  # Release asset and given this workflow and the `npm` environment as its Trusted Publisher.
  # A package npm has never seen is skipped with a warning and the others are still published.
  # A manual run publishes the tarballs of the Release its `tag` input names and builds nothing.
  publish-npm:
    name: Publish the Release tarballs to npm
    needs: release
    if: >-
      ${{ vars.NPM_TRUSTED_PUBLISHING == 'true' && !cancelled() &&
          (needs.release.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: npm
      url: https://www.npmjs.com/org/penguinharness
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Assert npm supports trusted publishing (>= 11.5.1)
        run: |
          V="$(npm --version)"
          echo "npm $V"
          node -e 'const [M, m, p] = process.argv[1].split(".").map(Number); if (M < 11 || (M === 11 && (m < 5 || (m === 5 && p < 1)))) { console.error("npm " + process.argv[1] + " < 11.5.1"); process.exit(1); }' "$V"

      - name: Download the tarballs the Release carries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --dir packs

      # A version npm already has is skipped, and must be the Release's bytes. A prerelease goes
      # under the `rc` dist-tag (npm refuses one without a tag), so `latest` keeps naming the
      # newest stable version.
      # The path starts with ./ because npm reads a bare `packs/<file>.tgz` as a GitHub
      # `owner/repository` shorthand and tries to clone it.
      - name: Publish each tarball npm does not have yet
        env:
          SKIP: ${{ github.event_name == 'workflow_dispatch' && inputs.skip || '' }}
        run: |
          set -euo pipefail
          failed=0
          for file in ./packs/*.tgz; do
            manifest="$(tar -xzOf "$file" package/package.json)"
            name="$(printf '%s' "$manifest" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
            version="$(printf '%s' "$manifest" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
            integrity="sha512-$(openssl dgst -sha512 -binary "$file" | base64 -w0)"
            case " $SKIP " in
              *" $name "*)
                echo "$name@$version is left out by the skip input."
                continue
                ;;
            esac
            if [ -z "$(npm view "$name" name 2>/dev/null || true)" ]; then
              echo "::warning::$name has never been published to npm, so it is skipped. Publish $(basename "$file") from this Release once by hand and set its Trusted Publisher to this workflow and the npm environment."
              continue
            fi
            published="$(npm view "$name@$version" dist.integrity 2>/dev/null || true)"
            if [ -n "$published" ]; then
              if [ "$published" != "$integrity" ]; then
                echo "::error::$name@$version is on npm as $published, but this Release carries $integrity."
                failed=1
              else
                echo "$name@$version is already on npm with the same bytes."
              fi
              continue
            fi
            case "$version" in
              *-*) npm publish "$file" --provenance --access public --tag rc ;;
              *) npm publish "$file" --provenance --access public ;;
            esac
          done
          exit "$failed"
