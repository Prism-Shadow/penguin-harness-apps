<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI 短剧工作室</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="identity">
        <img src="icon.svg" alt="" width="32" height="32" />
        <h1 data-label="title">AI 短剧工作室</h1>
      </div>
      <div class="history">
        <label for="jobs" data-label="history">历史记录</label
        ><select id="jobs"></select>
      </div>
    </header>
    <main>
      <form id="brief">
        <h2 data-label="brief">创作要求</h2>
        <label for="prompt" data-label="prompt">描述剧本</label
        ><textarea
          id="prompt"
          rows="7"
          maxlength="8000"
          required
          placeholder="可以写故事梗概、主要角色、场景光线、构图或分场剧情..."
        ></textarea>
        <fieldset>
          <legend data-label="try">试试这些主题</legend>
          <div id="ideas"></div>
        </fieldset>
        <fieldset>
          <legend data-label="shotCount">分镜数量</legend>
          <div class="seg" id="counts" role="group">
            <button type="button" data-count="4">4镜</button>
            <button type="button" data-count="6">6镜</button>
            <button type="button" data-count="8" class="active">8镜</button>
          </div>
        </fieldset>
        <label for="ratio" data-label="ratio">画幅比例</label
        ><select id="ratio">
          <option value="16:9">16:9 横屏剧集</option>
          <option value="9:16">9:16 竖屏短剧</option>
        </select>
        <button
          class="primary"
          id="generate"
          type="submit"
          data-label="generate"
        >
          生成短剧
        </button>
        <p id="error" role="alert" hidden></p>

        <details id="consistency-drawer" class="drawer" hidden>
          <summary data-label="consistencyTitle">角色与场景一致性设定</summary>
          <div class="drawer-body">
            <div class="drawer-field">
              <label for="char-select" data-label="charSelect"
                >角色设定卡</label
              >
              <select id="char-select"></select>
              <input id="char-name" type="text" placeholder="角色名称" />
              <textarea
                id="char-anchors"
                rows="2"
                placeholder="角色外观一致性锚点 (Identity Anchors)"
              ></textarea>
            </div>
            <div class="drawer-field">
              <label for="loc-select" data-label="locSelect">场景设定卡</label>
              <select id="loc-select"></select>
              <input id="loc-name" type="text" placeholder="场景名称" />
              <textarea
                id="loc-anchors"
                rows="2"
                placeholder="场景建筑与光影锚点 (Visual & Lighting Anchors)"
              ></textarea>
            </div>
            <button
              type="button"
              id="sync-consistency"
              data-label="syncConsistency"
            >
              保存并同步至全部分镜
            </button>
          </div>
        </details>
      </form>

      <section class="preview" aria-labelledby="preview-title">
        <div class="topline">
          <h2 id="preview-title" data-label="preview">预览</h2>
          <div id="stage-tools" class="stage-tools" hidden>
            <div class="seg seg-sm" id="play-modes">
              <button
                type="button"
                data-mode="episode"
                class="active"
                data-label="modeEpisode"
              >
                全集连播
              </button>
              <button type="button" data-mode="single" data-label="modeSingle">
                单镜预览
              </button>
            </div>
            <button id="export-btn" type="button" data-label="exportMp4">
              合成全集 MP4
            </button>
          </div>
        </div>

        <div id="stage">
          <div class="placeholder" id="placeholder">
            <div class="frame" aria-hidden="true">▧</div>
            <p id="status" role="status">生成的分镜与短剧视频会出现在这里。</p>
          </div>
        </div>

        <div id="workbench-workspace" class="workspace-detail" hidden>
          <div class="shots-header">
            <span id="shots-summary">分镜故事板（点击切换镜头）</span>
            <span id="isolation-badge" class="isolation-badge" hidden></span>
          </div>
          <div id="shots-grid" class="shots-grid"></div>

          <div id="shot-inspector" class="shot-inspector">
            <div class="inspector-top">
              <strong id="inspector-title">SHOT-001</strong>
              <span id="inspector-anchors" class="inspector-anchors"></span>
            </div>
            <div class="inspector-controls">
              <input
                id="shot-prompt"
                type="text"
                placeholder="修改当前镜头画面描述或运镜提示词..."
              />
              <select id="shot-grade" title="画面色调">
                <option value="default">原片色调</option>
                <option value="warm-amber">暖琥珀金</option>
                <option value="cool-rain">冷雨夜蓝</option>
                <option value="cinema-contrast">电影高反差</option>
              </select>
              <button
                type="button"
                id="rerender-btn"
                class="primary-sm"
                data-label="rerenderShot"
              >
                重绘当前镜头
              </button>
            </div>
          </div>
        </div>

        <div id="downloads"></div>
        <p id="detail" hidden></p>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
