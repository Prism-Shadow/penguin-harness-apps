<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Frostline</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <img src="icon.svg" alt="" />
          <h1>Frostline</h1>
        </div>
        <div class="toolbar">
          <button id="sound" type="button"></button
          ><button id="pause" type="button" disabled></button>
        </div>
      </header>
      <section id="slope" aria-label="Snowboard course">
        <canvas aria-label="Penguin snowboarding course"></canvas>
        <div class="hud">
          <div>
            <small data-i="distance"></small><strong id="distance">0 m</strong>
          </div>
          <div><small data-i="score"></small><strong id="score">0</strong></div>
        </div>
        <div class="objective">
          <b id="stamps"></b><span id="target"></span>
        </div>
        <div id="message" role="status" aria-live="polite"></div>
        <div id="panel">
          <div class="trail" data-i="trail"></div>
          <h2 id="heading"></h2>
          <p id="instructions"></p>
          <div class="actions">
            <button type="button" id="primary"></button
            ><button type="button" id="restart" hidden></button>
          </div>
        </div>
      </section>
      <div class="controls" aria-label="Board controls">
        <button type="button" data-hold="left">
          <span aria-hidden="true">↶</span> <b data-i="back"></b
          ><kbd>←</kbd></button
        ><button type="button" data-hold="jump">
          <span aria-hidden="true">⤴</span> <b data-i="jump"></b
          ><kbd>Space</kbd></button
        ><button type="button" data-hold="right">
          <span aria-hidden="true">↷</span> <b data-i="front"></b><kbd>→</kbd>
        </button>
      </div>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>
