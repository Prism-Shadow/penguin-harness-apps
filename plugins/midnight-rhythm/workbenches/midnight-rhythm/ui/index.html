<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Midnight Rhythm</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        color-scheme: dark;
        font:
          15px/1.4 "Trebuchet MS",
          system-ui,
          sans-serif;
        color: #f4edff;
        background: #121126;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        align-items: center;
        background:
          radial-gradient(ellipse at 72% 28%, #302248, transparent 65%), #121126;
      }
      body,
      h1,
      h2,
      .stat b {
        color: #f4f4ff;
      }
      main {
        width: min(100%, 1080px);
        margin: auto;
        padding: clamp(10px, 2.8vw, 32px);
      }
      header,
      .stats,
      .pad,
      .transport,
      footer,
      .buttons {
        display: flex;
        align-items: center;
      }
      header {
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: clamp(18px, 3vw, 34px);
        letter-spacing: -0.045em;
        margin: 0;
        line-height: 1.05;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo img {
        width: 34px;
        height: 34px;
      }
      .stats {
        gap: clamp(12px, 3vw, 30px);
      }
      .stat {
        display: grid;
        line-height: 1.14;
      }
      .stat small {
        font-size: 10px;
        letter-spacing: 0.08em;
        color: #bdb3d4;
      }
      .stat b {
        font-variant-numeric: tabular-nums;
        font-size: clamp(17px, 2.5vw, 26px);
      }
      .stage {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        border: 1px solid #685a84;
        border-radius: 18px;
        background: #241b44;
        box-shadow: 0 12px 35px #09061770;
      }
      canvas {
        display: block;
        width: 100%;
        height: clamp(220px, 49svh, 490px);
      }
      .stage svg.rider {
        width: 104px;
        height: 88px;
        position: absolute;
        inset: 0 auto auto 0;
        transform-origin: 50% 50%;
        pointer-events: none;
        overflow: visible;
      }
      .rider [data-sprite] {
        display: none;
      }
      .rider[data-pose="coast"] [data-sprite="coast"],
      .rider[data-pose="land"] [data-sprite="carve"],
      .rider[data-pose="carve"] [data-sprite="carve"],
      .rider[data-pose="flight"] [data-sprite="flight"] {
        display: inline;
      }
      .pad.struck {
        box-shadow: inset 0 -3px 0 #4ac6ac;
      }
      .pad.low.struck {
        box-shadow: inset 0 -3px 0 #dd8a54;
      }
      .meter {
        height: 3px;
        background: #3b2e53;
      }
      .meter i {
        display: block;
        background: #aaffdd;
        height: 100%;
        transform-origin: left;
        transform: scaleX(0);
      }
      .panel {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: clamp(12px, 4vw, 48px);
        background: linear-gradient(90deg, #17132504, #17132559);
      }
      .card {
        max-width: min(94%, 390px);
        padding: clamp(14px, 2vw, 24px);
        border: 1px solid #a6a5b6;
        border-top: 3px solid #ffad8c;
        border-radius: 14px;
        background: #1d263bf5;
        box-shadow: 0 5px 28px #11102380;
      }
      h2 {
        font-size: clamp(23px, 4vw, 38px);
        letter-spacing: -0.055em;
        margin: 0;
        line-height: 1.06;
      }
      .card p {
        color: #d8cee5;
        margin: 9px 0 13px;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 2px;
      }
      button:disabled {
        cursor: default;
      }
      .buttons {
        gap: 9px;
      }
      .action {
        font-weight: bold;
        border: 0;
        border-radius: 7px;
        background: #acf5d6;
        color: #182c29;
        padding: 8px 18px;
      }
      .sub,
      .transport button {
        background: #302844;
        border: 1px solid #635875;
        color: #e4d9ef;
        border-radius: 7px;
        padding: 7px 12px;
      }
      .pads {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 10px;
      }
      .pad {
        justify-content: space-between;
        min-height: 54px;
        border-radius: 12px;
        padding: 8px clamp(12px, 2vw, 25px);
        touch-action: none;
        font-weight: bold;
        border: 1px solid #5d8d83;
        background: #213b3d;
        color: #b6ffe4;
      }
      .pad.low {
        border-color: #997363;
        background: #463139;
        color: #ffd7bd;
      }
      .pad:active,
      .pad.struck {
        background: #bcf6e0;
        color: #192c29;
      }
      .pad.low:active,
      .pad.low.struck {
        background: #f8bc92;
        color: #372737;
      }
      .pad em {
        font-style: normal;
        font-size: 1.4em;
        margin-right: 8px;
      }
      kbd {
        font:
          11px/1.3 ui-monospace,
          monospace;
        padding: 3px 5px;
        border: 1px solid currentColor;
        border-radius: 4px;
        opacity: 0.8;
      }
      footer {
        justify-content: space-between;
        gap: 10px;
        color: #c6b8d4;
        margin-top: 10px;
        font-size: 13px;
      }
      #time {
        font-variant-numeric: tabular-nums;
      }
      .transport {
        gap: 8px;
      }
      [hidden] {
        display: none !important;
      }
      .route-choice {
        display: flex;
        gap: 4px;
        margin: 0 0 10px;
      }
      .route-choice button {
        background: #28314a;
        color: #e2e3ee;
        border: 1px solid #75839d;
        border-radius: 6px;
        padding: 6px 12px;
      }
      .route-choice button[aria-pressed="true"] {
        background: #abf6d7;
        color: #0d2a27;
        border-color: #abf6d7;
      }
      .section-name {
        position: absolute;
        top: 8px;
        left: 12px;
        padding: 3px 8px;
        border-left: 2px solid #a4fbd9;
        background: #151b32de;
        color: #effdef;
        font-weight: 700;
        font-size: 12px;
        pointer-events: none;
      }
      .card {
        overflow: auto;
        max-height: 100%;
      }
      .results {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 3px 15px;
        margin: 10px 0;
        color: #d8cee5;
      }
      .results b {
        color: #fff;
      }
      @media (max-width: 500px) {
        main {
          padding: 10px;
        }
        .logo img {
          display: none;
        }
        .stats {
          gap: 12px;
        }
        canvas {
          height: clamp(245px, 57svh, 490px);
        }
        .panel {
          align-items: flex-start;
          padding: 9px;
        }
        .card {
          max-width: 83%;
        }
        .pad {
          min-height: 66px;
        }
        footer {
          flex-wrap: wrap;
        }
      }
      @media (max-height: 460px) and (orientation: landscape) {
        main {
          padding: 5px 12px;
        }
        header {
          margin: 0 0 4px;
        }
        .logo img {
          height: 22px;
          width: 22px;
        }
        canvas {
          height: clamp(145px, 52svh, 235px);
        }
        .pad {
          min-height: 40px;
        }
        .pads,
        footer {
          margin-top: 4px;
        }
        .card {
          padding: 9px 16px;
        }
        .card p {
          margin: 3px 0 6px;
        }
        .results {
          margin: 4px 0;
        }
      }
      @media (pointer: coarse) {
        kbd {
          display: none;
        }
        .transport button,
        .action,
        .route-choice button,
        .sub {
          min-height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="logo">
          <img
            src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA5NiA5NiI+PHJlY3QgeD0iMyIgeT0iMyIgd2lkdGg9IjkwIiBoZWlnaHQ9IjkwIiByeD0iMjEiIGZpbGw9IiMyMDE5NDQiLz48cGF0aCBkPSJNMTcgNjloNjJNMTcgMzFoNjIiIHN0cm9rZT0iIzhiNzVjYiIgc3Ryb2tlLXdpZHRoPSIyIi8+PHBhdGggZD0iTTQ1IDU0VjI3bDI0LTZ2MjciIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2E1ZmZkYyIgc3Ryb2tlLXdpZHRoPSI3IiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48ZWxsaXBzZSBjeD0iMzkiIGN5PSI1OCIgcng9IjEwIiByeT0iNyIgZmlsbD0iI2E1ZmZkYyIvPjxlbGxpcHNlIGN4PSI2MiIgY3k9IjUxIiByeD0iMTAiIHJ5PSI3IiBmaWxsPSIjZmZhNjdiIi8+PHBhdGggZD0ibTIyIDc4IDEwLTUgOCAzIDE2LTcgOCAzIDEzLTciIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2U5YWRmZiIgc3Ryb2tlLXdpZHRoPSIzIiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48L3N2Zz4K"
            alt=""
          />
          <h1 id="name"></h1>
        </div>
        <div class="stats">
          <div class="stat">
            <small id="scoreLabel"></small><b id="score">0</b>

          <div class="stat">

      </header>
      <section class="stage">
        <canvas id="scene" aria-label="Two note lanes"></canvas>
        <svg
          id="rider"
          class="rider"
          data-pose="coast"
          aria-hidden="true"
          viewBox="0 0 104 88"
        >
          <defs>
            <g id="bird-art">
              <path
                d="M49 6C64 1 79 7 82 22C87 39 82 54 69 63C55 74 32 70 23 56C15 42 21 25 33 19C37 13 43 8 49 6Z"
                fill="#0d1c35"

                stroke-width="1.7"
              />
              <path
                d="M69 14C80 16 80 29 76 38C77 45 72 57 62 62C51 67 40 65 35 58C32 53 33 47 36 43C47 43 53 37 55 26C57 17 63 12 69 14Z"

        </svg>
        <div class="meter"><i id="meter"></i></div>
        <span id="station" class="section-name" hidden></span>
        <div class="panel" id="panel">
          <div class="card">
            <h2 id="heading"></h2>
            <p id="details"></p>
            <div class="results" id="results" hidden></div>
            <div class="route-choice" id="routes">
              <button type="button" id="tour"></button>
              <button type="button" id="encore"></button>
            </div>
            <div class="buttons">
              <button type="button" class="action" id="start"></button
              ><button type="button" class="sub" id="retry" hidden></button>

      <div class="pads">
        <button class="pad" id="high" type="button">
          <span><em>↑</em><span id="fly"></span></span><kbd>F / ↑</kbd></button
        ><button class="pad low" id="low" type="button">
          <span><em>↓</em><span id="sled"></span></span><kbd>J / ↓</kbd>
        </button>

        <span><b id="track"></b> · 112 BPM · <span id="time">0:00</span></span>
        <div class="transport">
          <button id="sound" type="button"></button
          ><button id="pause" type="button" disabled></button>
        </div>

    </main>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      const zh = (() => {
        try {
          return (
            (window.parent !== window &&
              window.parent.document.documentElement.lang) ||
            navigator.language
          ).startsWith("zh");
        } catch {
          return navigator.language.startsWith("zh");
        }
      })();
      const words = zh
        ? {
            name: "企鹅午夜节拍",
            track: "午夜末班车",
            encoreTrack: "桥上回声",
            released: "提前松开",
            play: "开始演奏",
            pause: "暂停",
            resume: "继续演奏",
            restart: "重新开始",
            complete: "演奏结束",
            paused: "已暂停",
            intro:
              "音符过星门时击打，有光带的长按到尾端。准确率达到 65% 通关。",
            wait: "准备好时，从刚才的节拍继续。",
            score: "得分",
            combo: "连击",
            best: "最长连击",
            fly: "展翅起飞",
            sled: "雪橇滑行",
            sound: "声音",
            routes: ["夜班", "安可"],
            stations: ["发车", "灯市", "跨江桥", "终点站"],
            hold: "长按",
            held: "长音",
            stray: "空拍",
            early: "偏早",
            late: "偏晚",
            accuracy: "准确率",
            record: "本档最高",
            practice: "练习",
            clear: "通关",
            again: "再演奏一次",
            error: "音频无法启动，请重试。",
            scenery: "上下两条节奏轨道",
          }
        : {
            name: "Midnight Rhythm",
            track: "Last Train After Midnight",
            encoreTrack: "Echoes on the Bridge",
            released: "Released early",
            play: "Play track",
            pause: "Pause",
            resume: "Resume",
            restart: "Restart",
            complete: "Track complete",
            paused: "Paused",
            intro:
              "Strike at the star gate. Hold ribbon notes to the end. Finish with 65% accuracy to clear the route.",
            wait: "Pick up from the same beat when you are ready.",
            score: "Score",
            combo: "Combo",
            best: "Best combo",
            fly: "Take flight",
            sled: "Ride the sled",
            sound: "Sound",
            routes: ["Night ride", "Encore"],
            stations: [
              "Departure",
              "Lantern market",
              "River bridge",
              "Terminus",
            ],
            hold: "Hold",
            held: "Holds",
            stray: "Off beat",
            early: "Early",
            late: "Late",
            accuracy: "Accuracy",
            record: "Route best",
            practice: "Practice",
            clear: "Cleared",
            again: "Play again",
            error: "Audio could not start. Try again.",
            scenery: "Upper and lower rhythm lanes",
          };
      document.documentElement.lang = zh ? "zh" : "en";
      document.title = words.name;
      for (const [id, key] of [
        ["name", "name"],
        ["track", "track"],
        ["fly", "fly"],
        ["sled", "sled"],
        ["scoreLabel", "score"],
        ["comboLabel", "combo"],
        ["pause", "pause"],
        ["retry", "restart"],
      ])
        $(id).textContent = words[key];
      $("scene").setAttribute("aria-label", words.scenery);
      const beat = 60 / 112,
        bars = 16,
        endBeat = bars * 4 + 2,
        duration = endBeat * beat;
      // Each four-bar station has its own phrase. The optional third value is a sustain in beats.
      const stations = [
        [
          [0, 0],
          [2, 1],
          [4, 1],
          [6, 0],
          [8, 0, 1.5],
          [10, 1],
          [12, 0],
          [14, 1],
        ],
        [
          [0, 1],
          [1.5, 0],
          [3, 1],
          [4, 0, 2],
          [7, 1],
          [8, 1],
          [9.5, 0],
          [11, 0],
          [12, 1, 2],
          [15, 0],
        ],
        [
          [0, 0, 2],
          [3, 1],
          [4, 0],
          [5.5, 1],
          [7, 0],
          [8, 1, 2],
          [11, 0],
          [12, 1],
          [13.5, 0],
          [15, 1],
        ],
        [
          [0, 1],
          [1, 0],
          [2, 1],
          [4, 0, 1.5],
          [6, 1],
          [7, 0],
          [8, 1],
          [9.5, 0],
          [11, 1],
          [12, 0, 1.5],
        ],
      ];
      const fills = [
        [
          [1, 1],
          [3, 0],
          [7, 1],
          [11, 0],
          [13, 1],
          [15, 0],
        ],
        [
          [0.5, 0],
          [2.5, 1],
          [6.5, 0],
          [8.5, 1],
          [10.5, 0],
          [14.5, 1],
        ],
        [
          [2.5, 0],
          [4.5, 1],
          [6.5, 1],
          [10.5, 0],
          [12.5, 1],
          [14.5, 0],
        ],
        [
          [0.5, 0],
          [2.5, 0],
          [3.5, 1],
          [5.5, 0],
          [7.5, 1],
          [10.5, 1],
          [13.5, 1],
          [14, 0],
        ],
      ];
      let route = 0;
      let chart = [];
      const records = [0, 0];
      try {
        const saved = JSON.parse(
          localStorage.getItem("midnight-rhythm.route-bests") || "[]",
        );
        for (let i = 0; i < 2; i++)
          if (Number.isSafeInteger(saved[i]) && saved[i] > 0)
            records[i] = saved[i];
      } catch {}
      function chooseRoute(index) {
        route = index;
        chart = stations.flatMap((phrase, section) => {
          const steps = route
            ? [...phrase, ...fills[section]].sort((a, b) => a[0] - b[0])
            : phrase;
          return steps.map(([step, lane, length = 0]) => ({
            time: (2 + 16 * section + step) * beat,
            lane,
            length: length * beat,
          }));
        });
        $("track").textContent = route ? words.encoreTrack : words.track;
        ["tour", "encore"].forEach((id, i) => {
          $(id).textContent = words.routes[i];
          $(id).setAttribute("aria-pressed", String(i === route));
        });
      }
      chooseRoute(0);
      for (const [index, id] of ["tour", "encore"].entries())
        $(id).onclick = () => {
          chooseRoute(index);
          setPanel("ready");
          draw(0);
        };
      const mint = "#a4fbd9",
        peach = "#ffc398",
        canvas = $("scene"),
        ctx = canvas.getContext("2d"),
        motion = !matchMedia("(prefers-reduced-motion: reduce)").matches;
      let audio = null,
        bus = null,
        noise = null,
        origin = 0,
        nextTick = 0,
        timer = 0,
        frame = 0,
        phase = "ready",
        muted = false,
        notes = [],
        points = 0,
        combo = 0,
        best = 0,
        counts = [0, 0, 0],
        missedPresses = 0,
        heldNotes = 0,
        activeHold = null,
        lastHit = null,
        action = null;

        }
        const rider = $("rider");
        rider.dataset.pose = pose;
        rider.style.transform =
          "translate(" +
          (x - 52) +
          "px," +
          (y - 44) +
          "px) scale(" +
          size +
          ") rotate(" +
          angle +
          "deg)";
        $("high").classList.toggle("struck", action?.lane === 0 && age < 0.15);
        $("low").classList.toggle("struck", action?.lane === 1 && age < 0.15);
        if (!motion || !action) return;
        const burst = action.lane === 0 && age >= 0.56 ? age - 0.56 : age;
        if (burst > 0.3) return;
        ctx.save();
        ctx.globalAlpha = (1 - burst / 0.3) * 0.85;
        const originY =
          action.lane === 0 && age < 0.56 ? y + 13 * size : y + 23 * size;
        for (let i = 0; i < 7; i++) {
          const length = (9 + (i % 4) * 5) * size;
          const dx = (28 + burst * (66 + i * 29)) * size;
          const dy = (i - 3) * (2 + burst * 13) * size;
          line(
            x - dx,
            originY + dy,
            x - dx - length,
            originY + dy + 3 * size,
            i % 2 ? "#ffe5ae" : "#a5fff4",
            (2.8 - (i % 3) * 0.5) * size,
          );
        }
        ctx.restore();
      }
      function note(x, y, r, lane) {
        ctx.save();
        ctx.translate(x, y);
        const colour = lane ? peach : mint;
        // Each note carries the arrow from its pad, including in monochrome.
        shape(
          [
            [0, -r],
            [r, 0],
            [0, r],
            [-r, 0],
          ],
          colour,
        );
        ctx.scale(1, lane ? -1 : 1);
        line(-r * 0.43, r * 0.18, 0, -r * 0.32, "#142338", 2.5);
        line(0, -r * 0.32, r * 0.43, r * 0.18, "#142338", 2.5);
        ctx.restore();
      }
      function draw(t) {
        const box = canvas.getBoundingClientRect(),
          w = box.width,
          h = box.height;
        if (!w || !h) return;
        const dpr = Math.min(2, devicePixelRatio || 1);
        if (
          canvas.width !== Math.round(w * dpr) ||
          canvas.height !== Math.round(h * dpr)
        ) {
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const sky = ctx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, daylight.matches ? "#646ea2" : "#171b42");
        sky.addColorStop(0.55, daylight.matches ? "#d6a7b4" : "#545b91");
        sky.addColorStop(1, daylight.matches ? "#ffcb97" : "#c485a0");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);
        stars(w, h, t);
        nightRail(w, h, t);
        // A streak lights the windows of a passing sound desk, four beats per bar.
        if (combo >= 4) {
          const lit = Math.min(8, Math.floor(combo / 4) + 1);
          const step = motion ? Math.floor(t / beat) % 4 : 0;
          const x = Math.max(12, w - 72);
          for (let i = 0; i < 8; i++) {
            const height = i < lit ? 5 + 3 * ((i + step) % 4) : 3;
            ctx.fillStyle =
              i < lit ? (route ? "#ffd09e" : "#afffe0") : "#445073";
            ctx.fillRect(x + i * 7, 24 - height, 4, height);
          }
        }
        const gate = Math.max(54, w * 0.2),
          lanes = [h * 0.42, h * 0.76],
          scale = Math.min(h / 230, w / 440, 1.65);
        for (let lane = 0; lane < 2; lane++) {
          const y = lanes[lane],
            ink = lane ? peach : mint;
          ctx.fillStyle = lane ? "#221b34c9" : "#192439bd";
          ctx.fillRect(0, y - h * 0.057, w, h * 0.115);
          line(0, y, w, y, ink + "90", 1.3);
          const pitch = Math.max(32, ((w - gate) * beat) / 2.45);
          for (
            let xx = gate + (motion ? ((-t / beat) % 1) * pitch : 0);
            xx < w;
            xx += pitch
          ) {
            line(xx, y - 2, xx, y + 2, ink + "99", 1.5);
          }
          const pulse = motion ? Math.max(0, 1 - ((t / beat) % 1) * 3) : 0;
          line(
            gate - 11 * scale,
            y + 12 * scale,
            gate + 10 * scale,
            y + 12 * scale,
            ink,
            1.8,
          );
          ellipse(
            gate,
            y,
            13 * scale + pulse * 3,
            13 * scale + pulse * 3,
            ink + "32",
          );
          ctx.save();
          ctx.translate(gate, y);
          ctx.rotate(Math.PI / 4);
          ctx.strokeStyle = ink;
          ctx.lineWidth = 2;
          ctx.strokeRect(-6 * scale, -6 * scale, 12 * scale, 12 * scale);
          ctx.restore();
        }
        const visible = phase === "ready" ? chart : notes,
          approach = 2.45;
        for (const n of visible) {
          const offset = n.time - t;
          const end = offset + (n.length || 0);
          if (
            n.length &&
            end >= 0 &&
            offset < approach &&
            (!n.hit || activeHold?.note === n)
          ) {
            const x1 = gate + (Math.max(0, offset) * (w - gate)) / approach;
            const x2 = gate + (end * (w - gate)) / approach;
            const ink = n.lane ? peach : mint;
            line(
              x1,
              lanes[n.lane],
              x2,
              lanes[n.lane],
              ink + "b8",
              Math.max(5, 7 * scale),
            );
            line(x2, lanes[n.lane] - 6, x2, lanes[n.lane] + 6, ink, 3);
            if (activeHold?.note === n) {
              const progress = Math.max(
                0,
                Math.min(1, (t - n.time) / n.length),
              );
              ctx.beginPath();
              ctx.arc(
                gate,
                lanes[n.lane],
                17 * scale,
                -Math.PI / 2,
                -Math.PI / 2 + progress * Math.PI * 2,
              );
              ctx.strokeStyle = "#ffffff";
              ctx.lineWidth = 4;
              ctx.stroke();
            }
          }
          if (n.hit) continue;
          if (offset < -0.28 || offset > approach * 1.1) continue;
          note(
            gate + (offset * (w - gate)) / approach,
            lanes[n.lane],
            Math.max(12, 13 * scale),
            n.lane,
          );
        }
        paintRider(w, h, gate, lanes, t);
        if (lastHit && t - lastHit.t < 0.65) {
          const dt = t - lastHit.t;
          ctx.save();
          ctx.globalAlpha = Math.min(1, (0.65 - dt) * 5);
          if (!lastHit.miss && motion && dt < 0.34) {
            ctx.strokeStyle = lastHit.lane ? peach : mint;
            ctx.lineWidth = Math.max(1, 3 * (1 - dt / 0.34));
            ctx.beginPath();
            ctx.arc(
              gate,
              lanes[lastHit.lane],
              (11 + dt * 68) * scale,
              0,
              Math.PI * 2,
            );
            ctx.stroke();
            for (let k = 0; k < 6; k++) {
              const angle = (k * Math.PI) / 3,
                r = (13 + dt * 83) * scale;
              line(
                gate + Math.cos(angle) * r,
                lanes[lastHit.lane] + Math.sin(angle) * r,
                gate + Math.cos(angle) * (r + 6),
                lanes[lastHit.lane] + Math.sin(angle) * (r + 6),
                lastHit.lane ? peach : mint,
                2,
              );
            }
          }
          ctx.font = "bold " + Math.max(14, 16 * scale) + "px system-ui";
          ctx.fillStyle = lastHit.miss
            ? "#f8c2c6"
            : lastHit.lane
              ? peach
              : mint;
          ctx.textAlign = "center";
          const label =
            lastHit.label === "Miss" ? (zh ? "漏拍" : "Miss") : lastHit.label;
          const labelX = Math.max(gate, ctx.measureText(label).width / 2 + 3);
          const labelY = lanes[lastHit.lane] - (17 + dt * 13) * scale;
          ctx.lineWidth = 4;
          ctx.strokeStyle = "#192236";
          ctx.strokeText(label, labelX, labelY);
          ctx.fillText(label, labelX, labelY);
          ctx.restore();
        }
        const stop = Math.min(3, Math.max(0, Math.floor((t / beat - 2) / 16)));
        if ($("station").dataset.stop !== String(stop)) {
          $("station").dataset.stop = String(stop);
          $("station").textContent =
            stop + 1 + " / 4 · " + words.stations[stop];
        }
        $("meter").style.transform =
          "scaleX(" + Math.min(1, t / duration) + ")";
        $("time").textContent =
          Math.floor(t / 60) +
          ":" +
          String(Math.floor(t) % 60).padStart(2, "0");
      }
      new ResizeObserver(() =>
        draw(phase === "done" ? duration : elapsed()),
      ).observe(canvas);
      setPanel("ready");
      draw(0);
    </script>
  </body>
</html>
