<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Midnight Rhythm</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        color-scheme: dark;
        font:
          15px/1.4 "Trebuchet MS",
          system-ui,
          sans-serif;
        color: #f4edff;
        background: #121126;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        align-items: center;
        background:
          radial-gradient(ellipse at 72% 28%, #302248, transparent 65%), #121126;
      }
      main {
        width: min(100%, 1080px);
        margin: auto;
        padding: clamp(10px, 2.8vw, 32px);
      }
      header,
      .stats,
      .pad,
      .transport,
      footer,
      .buttons {
        display: flex;
        align-items: center;
      }
      header {
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: clamp(18px, 3vw, 34px);
        letter-spacing: -0.045em;
        margin: 0;
        line-height: 1.05;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo img {
        width: 34px;
        height: 34px;
      }
      .stats {
        gap: clamp(12px, 3vw, 30px);
      }
      .stat {
        display: grid;
        line-height: 1.14;
      }
      .stat small {
        font-size: 10px;
        letter-spacing: 0.08em;
        color: #bdb3d4;
      }
      .stat b {
        font-variant-numeric: tabular-nums;
        font-size: clamp(17px, 2.5vw, 26px);
      }
      .stage {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        border: 1px solid #685a84;
        border-radius: 18px;
        background: #241b44;
        box-shadow: 0 12px 35px #09061770;
      }
      canvas {
        display: block;
        width: 100%;
        height: clamp(220px, 49svh, 490px);
      }
      .meter {
        height: 3px;
        background: #3b2e53;
      }
      .meter i {
        display: block;
        background: #aaffdd;
        height: 100%;
        transform-origin: left;
        transform: scaleX(0);
      }
      .panel {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(90deg, #17132522, #171325b3);
      }
      .card {
        max-width: min(94%, 390px);
        padding: clamp(14px, 2vw, 24px);
        border: 1px solid #806d99;
        border-radius: 14px;
        background: #211a38f4;
        box-shadow: 0 5px 28px #11102380;
      }
      h2 {
        font-size: clamp(23px, 4vw, 38px);
        letter-spacing: -0.055em;
        margin: 0;
        line-height: 1.06;
      }
      .card p {
        color: #d8cee5;
        margin: 9px 0 13px;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 2px;
      }
      button:disabled {
        cursor: default;
      }
      .buttons {
        gap: 9px;
      }
      .action {
        font-weight: bold;
        border: 0;
        border-radius: 7px;
        background: #acf5d6;
        color: #182c29;
        padding: 8px 18px;
      }
      .sub,
      .transport button {
        background: #302844;
        border: 1px solid #635875;
        color: #e4d9ef;
        border-radius: 7px;
        padding: 7px 12px;
      }
      .pads {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 10px;
      }
      .pad {
        justify-content: space-between;
        min-height: 54px;
        border-radius: 12px;
        padding: 8px clamp(12px, 2vw, 25px);
        touch-action: none;
        font-weight: bold;
        border: 1px solid #5d8d83;
        background: #213b3d;
        color: #b6ffe4;
      }
      .pad.low {
        border-color: #997363;
        background: #463139;
        color: #ffd7bd;
      }
      .pad:active,
      .pad.struck {
        background: #bcf6e0;
        color: #192c29;
      }
      .pad.low:active,
      .pad.low.struck {
        background: #f8bc92;
        color: #372737;
      }
      .pad em {
        font-style: normal;
        font-size: 1.4em;
        margin-right: 8px;
      }
      kbd {
        font:
          11px/1.3 ui-monospace,
          monospace;
        padding: 3px 5px;
        border: 1px solid currentColor;
        border-radius: 4px;
        opacity: 0.8;
      }
      footer {
        justify-content: space-between;
        gap: 10px;
        color: #c6b8d4;
        margin-top: 10px;
        font-size: 13px;
      }
      #time {
        font-variant-numeric: tabular-nums;
      }
      .transport {
        gap: 8px;
      }
      [hidden] {
        display: none !important;
      }
      .results {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 3px 15px;
        margin: 10px 0;
        color: #d8cee5;
      }
      .results b {
        color: #fff;
      }
      @media (max-width: 500px) {
        main {
          padding: 10px;
        }
        .logo img {
          display: none;
        }
        .stats {
          gap: 12px;
        }
        canvas {
          height: clamp(245px, 57svh, 490px);
        }
        .card {
          max-width: 85%;
        }
        .pad {
          min-height: 66px;
        }
        footer {
          flex-wrap: wrap;
        }
      }
      @media (max-height: 460px) and (orientation: landscape) {
        main {
          padding: 5px 12px;
        }
        header {
          margin: 0 0 4px;
        }
        .logo img {
          height: 22px;
          width: 22px;
        }
        canvas {
          height: clamp(145px, 52svh, 235px);
        }
        .pad {
          min-height: 40px;
        }
        .pads,
        footer {
          margin-top: 4px;
        }
        .card {
          padding: 9px 16px;
        }
        .card p {
          margin: 3px 0 6px;
        }
        .results {
          margin: 4px 0;
        }
      }
      @media (pointer: coarse) {
        kbd {
          display: none;
        }
        .transport button {
          min-height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="logo">
          <img
            src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA5NiA5NiI+PHJlY3QgeD0iMyIgeT0iMyIgd2lkdGg9IjkwIiBoZWlnaHQ9IjkwIiByeD0iMjEiIGZpbGw9IiMyMDE5NDQiLz48cGF0aCBkPSJNMTcgNjloNjJNMTcgMzFoNjIiIHN0cm9rZT0iIzhiNzVjYiIgc3Ryb2tlLXdpZHRoPSIyIi8+PHBhdGggZD0iTTQ1IDU0VjI3bDI0LTZ2MjciIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2E1ZmZkYyIgc3Ryb2tlLXdpZHRoPSI3IiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48ZWxsaXBzZSBjeD0iMzkiIGN5PSI1OCIgcng9IjEwIiByeT0iNyIgZmlsbD0iI2E1ZmZkYyIvPjxlbGxpcHNlIGN4PSI2MiIgY3k9IjUxIiByeD0iMTAiIHJ5PSI3IiBmaWxsPSIjZmZhNjdiIi8+PHBhdGggZD0ibTIyIDc4IDEwLTUgOCAzIDE2LTcgOCAzIDEzLTciIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2U5YWRmZiIgc3Ryb2tlLXdpZHRoPSIzIiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48L3N2Zz4K"
            alt=""
          />
          <h1 id="name"></h1>
        </div>
        <div class="stats">
          <div class="stat">
            <small id="scoreLabel"></small><b id="score">0</b>
          </div>
          <div class="stat">
            <small id="comboLabel"></small><b id="combo">0×</b>
          </div>
        </div>
      </header>
      <section class="stage">
        <canvas id="scene" aria-label="Two note lanes"></canvas>
        <div class="meter"><i id="meter"></i></div>
        <div class="panel" id="panel">
          <div class="card">
            <h2 id="heading"></h2>
            <p id="details"></p>
            <div class="results" id="results" hidden></div>
            <div class="buttons">
              <button type="button" class="action" id="start"></button
              ><button type="button" class="sub" id="retry" hidden></button>
            </div>
          </div>
        </div>
      </section>
      <div class="pads">
        <button class="pad" id="high" type="button">
          <span><em>↑</em><span id="fly"></span></span><kbd>F / ↑</kbd></button
        ><button class="pad low" id="low" type="button">
          <span><em>↓</em><span id="sled"></span></span><kbd>J / ↓</kbd>
        </button>
      </div>
      <footer>
        <span><b id="track"></b> · 112 BPM · <span id="time">0:00</span></span>
        <div class="transport">
          <button id="sound" type="button"></button
          ><button id="pause" type="button" disabled></button>
        </div>
      </footer>
    </main>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      const zh = (() => {
        try {
          return (
            (window.parent !== window &&
              window.parent.document.documentElement.lang) ||
            navigator.language
          ).startsWith("zh");
        } catch {
          return navigator.language.startsWith("zh");
        }
      })();
      const words = zh
        ? {
            name: "企鹅午夜节拍",
            track: "午夜末班车",
            play: "开始演奏",
            pause: "暂停",
            resume: "继续演奏",
            restart: "重新开始",
            complete: "演奏结束",
            paused: "已暂停",
            intro:
              "音符经过左侧星门时击打。上层展翅，下层滑雪橇。漏接后跟上下一拍。",
            wait: "准备好时，从刚才的节拍继续。",
            score: "得分",
            combo: "连击",
            best: "最长连击",
            fly: "展翅起飞",
            sled: "雪橇滑行",
            sound: "声音",
            again: "再演奏一次",
            error: "音频无法启动，请重试。",
            scenery: "上下两条节奏轨道",
          }
        : {
            name: "Midnight Rhythm",
            track: "Last Train After Midnight",
            play: "Play track",
            pause: "Pause",
            resume: "Resume",
            restart: "Restart",
            complete: "Track complete",
            paused: "Paused",
            intro:
              "Strike as a note crosses the star gate. Fly on the high lane and sled on the low lane. A miss leaves the music playing.",
            wait: "Pick up from the same beat when you are ready.",
            score: "Score",
            combo: "Combo",
            best: "Best combo",
            fly: "Take flight",
            sled: "Ride the sled",
            sound: "Sound",
            again: "Play again",
            error: "Audio could not start. Try again.",
            scenery: "Upper and lower rhythm lanes",
          };
      document.documentElement.lang = zh ? "zh" : "en";
      document.title = words.name;
      for (const [id, key] of [
        ["name", "name"],
        ["track", "track"],
        ["fly", "fly"],
        ["sled", "sled"],
        ["scoreLabel", "score"],
        ["comboLabel", "combo"],
        ["pause", "pause"],
        ["retry", "restart"],
      ])
        $(id).textContent = words[key];
      $("scene").setAttribute("aria-label", words.scenery);
      const beat = 60 / 112,
        bars = 16,
        endBeat = bars * 4 + 2,
        duration = endBeat * beat;
      const sequence = [
        [0, 0],
        [2, 1],
        [4, 1],
        [6, 0],
        [8, 0],
        [10, 1],
        [11.5, 0],
        [13, 1],
        [15, 0],
      ];
      const chart = [];
      for (let section = 0; section < 4; section++) {
        for (const [step, lane] of sequence) {
          const at = 2 + section * 16 + step;
          if (at < endBeat - 2)
            chart.push({
              time: at * beat,
              lane: (lane + (section === 2 ? 1 : 0)) % 2,
            });
        }
      }
      const mint = "#a4fbd9",
        peach = "#ffc398",
        canvas = $("scene"),
        ctx = canvas.getContext("2d"),
        motion = !matchMedia("(prefers-reduced-motion: reduce)").matches;
      let audio = null,
        bus = null,
        noise = null,
        origin = 0,
        nextTick = 0,
        timer = 0,
        frame = 0,
        phase = "ready",
        muted = false,
        notes = [],
        points = 0,
        combo = 0,
        best = 0,
        counts = [0, 0, 0],
        lastHit = null;
      const elapsed = () =>
        audio ? Math.max(0, audio.currentTime - origin) : 0;
      function tone(hz, when, length, volume, wave = "sine", endHz = hz) {
        const osc = audio.createOscillator(),
          env = audio.createGain();
        osc.type = wave;
        osc.frequency.setValueAtTime(hz, when);
        osc.frequency.exponentialRampToValueAtTime(endHz, when + length);
        env.gain.setValueAtTime(0.0001, when);
        env.gain.exponentialRampToValueAtTime(volume, when + 0.012);
        env.gain.exponentialRampToValueAtTime(0.0001, when + length);
        osc.connect(env).connect(bus);
        osc.start(when);
        osc.stop(when + length + 0.02);
      }
      function hiss(when, length, volume, cutoff) {
        const src = audio.createBufferSource(),
          filter = audio.createBiquadFilter(),
          env = audio.createGain();
        src.buffer = noise;
        filter.type = "highpass";
        filter.frequency.value = cutoff;
        env.gain.setValueAtTime(volume, when);
        env.gain.exponentialRampToValueAtTime(0.0001, when + length);
        src.connect(filter).connect(env).connect(bus);
        src.start(when);
        src.stop(when + length);
      }
      const hz = (n) => 440 * Math.pow(2, (n - 69) / 12);
      const roots = [50, 46, 53, 48],
        lead = [
          [0, 7, 10, 7, 12, 10, 7, 3],
          [0, 5, 7, 10, 7, 5, 3, 0],
          [0, 3, 7, 12, 10, 7, 3, 7],
          [0, 7, 5, 3, 0, 3, 5, 7],
        ];
      function schedule() {
        if (phase !== "playing") return;
        while (
          nextTick < endBeat * 2 &&
          origin + (nextTick * beat) / 2 < audio.currentTime + 0.2
        ) {
          const tick = nextTick++,
            bar = Math.floor(tick / 8),
            pos = tick % 8,
            when = origin + (tick * beat) / 2;
          if (when < audio.currentTime - 0.03) continue;
          const root = roots[bar % 4];
          if (bar >= bars) {
            if (pos === 0) tone(hz(62), when, beat * 1.8, 0.12);
            continue;
          }
          if (pos % 4 === 0) tone(130, when, 0.16, 0.28, "sine", 44);
          if (pos % 4 === 2) {
            hiss(when, 0.11, 0.11, 1250);
            tone(155, when, 0.09, 0.045, "triangle", 90);
          }
          hiss(when, pos % 2 ? 0.055 : 0.035, pos % 2 ? 0.022 : 0.038, 5800);
          if (pos % 2 === 0)
            tone(
              hz(root - 12 + (pos === 6 ? 7 : 0)),
              when,
              beat * 0.7,
              0.17,
              "triangle",
            );
          if (pos === 0 || pos === 4) {
            for (const n of [0, bar % 4 === 0 || bar % 4 === 3 ? 3 : 4, 7])
              tone(hz(root + n + 12), when, beat * 1.22, 0.035, "sine");
          }
          const pitch = hz(
            root + 12 + lead[bar % 4][pos] + (bar >= 8 && bar < 12 ? 12 : 0),
          );
          if (pos !== 3 || bar % 2 === 1)
            tone(
              pitch,
              when,
              beat * (pos % 4 === 0 ? 0.75 : 0.36),
              pos % 2 ? 0.054 : 0.086,
              "triangle",
            );
        }
      }
      function syncSound() {
        if (bus)
          bus.gain.setTargetAtTime(muted ? 0 : 0.64, audio.currentTime, 0.015);
        $("sound").setAttribute("aria-pressed", String(!muted));
        $("sound").textContent = words.sound + (muted ? " ×" : " ♪");
      }
      $("sound").onclick = () => {
        muted = !muted;
        syncSound();
      };
      syncSound();
      function scoreView() {
        $("score").textContent = points.toLocaleString();
        $("combo").textContent = combo + "×";
      }
      function setPanel(state) {
        phase = state;
        const p = $("panel");
        p.hidden = state === "playing";
        $("results").hidden = state !== "done";
        $("retry").hidden = state !== "paused";
        $("pause").disabled = state !== "playing";
        $("high").disabled = $("low").disabled = state !== "playing";
        $("heading").textContent =
          state === "done"
            ? words.complete
            : state === "paused"
              ? words.paused
              : words.track;
        $("details").textContent =
          state === "done"
            ? words.score + " · " + points.toLocaleString()
            : state === "paused"
              ? words.wait
              : words.intro;
        $("start").textContent =
          state === "done"
            ? words.again
            : state === "paused"
              ? words.resume
              : words.play;
        if (state === "done") {
          $("results").replaceChildren();
          for (const [name, val] of [
            ["Perfect", counts[0]],
            ["Great", counts[1]],
            ["Miss", counts[2]],
            [words.best, best],
          ]) {
            const item = document.createElement("span");
            item.textContent = name + " · ";
            const b = document.createElement("b");
            b.textContent = val;
            item.append(b);
            $("results").append(item);
          }
        }
      }
      async function start() {
        if (phase === "starting") return;
        const resume = phase === "paused";
        phase = "starting";
        try {
          if (!resume) {
            if (audio && audio.state !== "closed") await audio.close();
            audio = new (window.AudioContext || window.webkitAudioContext)();
            bus = audio.createGain();
            bus.connect(audio.destination);
            noise = audio.createBuffer(
              1,
              Math.ceil(audio.sampleRate * 0.16),
              audio.sampleRate,
            );
            const v = noise.getChannelData(0);
            for (let i = 0; i < v.length; i++) v[i] = Math.random() * 2 - 1;
            notes = chart.map((note) => ({ ...note, hit: false }));
            points = combo = best = nextTick = 0;
            lastHit = null;
            counts = [0, 0, 0];
            scoreView();
            syncSound();
          }
          await audio.resume();
          if (!resume) origin = audio.currentTime + 0.12;
          setPanel("playing");
          schedule();
          clearInterval(timer);
          timer = setInterval(schedule, 35);
          tick();
        } catch {
          setPanel("ready");
          $("details").textContent = words.error;
        }
      }
      async function pause() {
        if (phase !== "playing") return;
        setPanel("paused");
        cancelAnimationFrame(frame);
        clearInterval(timer);
        await audio.suspend();
        $("start").focus();
      }
      $("start").onclick = start;
      $("pause").onclick = pause;
      $("retry").onclick = () => {
        setPanel("ready");
        start();
      };
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) void pause();
      });
      function strike(lane) {
        if (phase !== "playing") return;
        const t = elapsed();
        let nearest = null,
          diff = 0.245;
        for (const n of notes) {
          const d = Math.abs(n.time - t);
          if (!n.hit && n.lane === lane && d <= diff) {
            nearest = n;
            diff = d;
          }
        }
        if (!nearest) return;
        nearest.hit = true;
        const perfect = diff <= 0.125;
        counts[perfect ? 0 : 1]++;
        combo++;
        best = Math.max(best, combo);
        points += (perfect ? 120 : 75) + Math.min(40, (combo - 1) * 2);
        lastHit = { t, lane, label: perfect ? "Perfect" : "Great" };
        scoreView();
      }
      const keyLane = { f: 0, ArrowUp: 0, j: 1, ArrowDown: 1 };
      document.addEventListener("keydown", (e) => {
        if (e.repeat || e.altKey || e.ctrlKey || e.metaKey) return;
        const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
        if (phase === "playing" && key in keyLane) {
          e.preventDefault();
          strike(keyLane[key]);
        } else if (
          key === " " &&
          phase === "playing" &&
          !e.target.closest("button")
        ) {
          e.preventDefault();
          void pause();
        }
      });
      for (const [id, lane] of [
        ["high", 0],
        ["low", 1],
      ]) {
        const pad = $(id);
        pad.onpointerdown = (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          strike(lane);
        };
        pad.onclick = (e) => {
          if (e.detail === 0) strike(lane);
        };
      }
      function tick() {
        if (phase !== "playing") return;
        const t = elapsed();
        for (const n of notes) {
          if (!n.hit && t > n.time + 0.245) {
            n.hit = true;
            combo = 0;
            counts[2]++;
            lastHit = { t, lane: n.lane, label: "Miss" };
            scoreView();
          }
        }
        draw(t);
        if (t >= duration) {
          clearInterval(timer);
          setPanel("done");
          $("start").focus();
          return;
        }
        frame = requestAnimationFrame(tick);
      }
      function ellipse(x, y, rx, ry, colour, rotation = 0) {
        ctx.fillStyle = colour;
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, rotation, 0, Math.PI * 2);
        ctx.fill();
      }
      function line(x1, y1, x2, y2, colour, weight) {
        ctx.strokeStyle = colour;
        ctx.lineWidth = weight;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
      function shape(points, colour) {
        ctx.fillStyle = colour;
        ctx.beginPath();
        ctx.moveTo(...points[0]);
        for (const p of points.slice(1)) ctx.lineTo(...p);
        ctx.closePath();
        ctx.fill();
      }
      function stars(w, h, t) {
        for (let i = 0; i < 38; i++) {
          const x = (i * 173.1 + 64) % w,
            y = (i * i * 7.3 + 23) % (h * 0.68);
          const glow = 0.35 + 0.3 * Math.sin(i + (motion ? t * 0.6 : 0));
          ctx.fillStyle = "rgba(255,244,213," + glow + ")";
          ctx.fillRect(x, y, i % 5 ? 1.2 : 2, i % 5 ? 1.2 : 2);
        }
      }
      function skyline(w, h, t) {
        const horizon = h * 0.76;
        for (let layer = 0; layer < 2; layer++) {
          const pitch = layer ? 44 : 29,
            speed = motion ? t * (layer ? 11 : 4) : 0,
            shift = speed % pitch;
          for (let i = -1; i < Math.ceil(w / pitch) + 1; i++) {
            const n = i + 1 + Math.floor(speed / pitch),
              seed = Math.abs(Math.sin(n * 91.23 + layer));
            const height = (layer ? 0.13 : 0.18) * h + seed * 0.23 * h,
              x = i * pitch - shift,
              y = horizon - height;
            ctx.fillStyle = layer ? "#292347" : "#45395b";
            ctx.fillRect(x, y, pitch - 3, height);
            if (n % 5 === 0)
              line(
                x + pitch * 0.5,
                y,
                x + pitch * 0.5,
                y - h * 0.04,
                "#594363",
                1.3,
              );
            if (layer) {
              ctx.fillStyle = n % 3 ? "#736178" : "#c09184";
              for (let k = 1; k < 5; k++)
                if ((k + n) % 3 !== 0)
                  ctx.fillRect(x + 6 + (n % 2) * 4, y + k * 9, 4, 2);
            }
          }
        }
        const rail = h * 0.875;
        ctx.fillStyle = "#33213f";
        ctx.fillRect(0, rail, w, h - rail);
        line(0, rail, w, rail, "#d78a9d", 2);
        for (let n = 0; n < w / 40 + 2; n++) {
          const x = n * 40 - (motion ? (t * 44) % 40 : 0);
          line(x, rail, x - 30, h, "#5e3857", 2);
        }
      }
      function penguin(x, y, size, sled, fly, t) {
        ctx.save();
        ctx.translate(
          x,
          y + (!fly && !sled && motion ? Math.sin(t * 11) * 2 : 0),
        );
        ctx.scale(size, size);
        ctx.rotate(fly ? -0.12 : 0);
        if (sled) {
          ctx.strokeStyle = "#ffba8a";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(-22, 16);
          ctx.quadraticCurveTo(14, 22, 25, 12);
          ctx.stroke();
          line(-12, 13, -13, 17, "#dc8a7d", 2);
          line(13, 12, 14, 16, "#dc8a7d", 2);
          ctx.rotate(0.89);
          ctx.translate(0, -1);
        }
        ellipse(0, 0, 12, 19, "#181b36", -0.13);
        ellipse(3, 3, 9, 14, "#f5eadf", -0.19);
        ellipse(1, -12, 12, 11, "#1d203b");
        ellipse(6, -12, 6.7, 7.6, "#fcf2e5");
        ellipse(8, -13, 1.8, 2.3, "#201b34");
        shape(
          [
            [11, -12],
            [20, -10],
            [11, -8],
          ],
          "#ffbc83",
        );
        shape(
          [
            [-9, -6],
            [-23, fly ? -13 : -3],
            [-14, fly ? -4 : 0],
            [-6, -2],
          ],
          "#ec86aa",
        );
        line(-8, -5, 8, -5, "#f198b8", 3.5);
        ctx.save();
        ctx.rotate(fly ? 0.94 : 0.15);
        ellipse(-10, 0, 4.4, 12, "#33334f", fly ? 0.65 : 0.28);
        ctx.restore();
        ellipse(-4, 17, 6, 2.7, "#ffb87b", -0.18);
        ellipse(6, 17, 5.8, 2.6, "#ffb87b", -0.1);
        ctx.restore();
      }
      function note(x, y, r, lane) {
        ctx.save();
        ctx.translate(x, y);
        const colour = lane ? peach : mint;
        ctx.shadowColor = colour;
        ctx.shadowBlur = 6;
        ctx.strokeStyle = colour;
        ctx.lineWidth = r * 0.26;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(0, r * 0.2);
        ctx.lineTo(0, -r * 0.88);
        ctx.quadraticCurveTo(r * 0.25, -r * 0.58, r * 0.57, -r * 0.6);
        ctx.stroke();
        ellipse(-r * 0.24, r * 0.22, r * 0.36, r * 0.25, colour, -0.32);
        ctx.restore();
      }
      function draw(t) {
        const box = canvas.getBoundingClientRect(),
          w = box.width,
          h = box.height;
        if (!w || !h) return;
        const dpr = Math.min(2, devicePixelRatio || 1);
        if (
          canvas.width !== Math.round(w * dpr) ||
          canvas.height !== Math.round(h * dpr)
        ) {
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const sky = ctx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, "#1a1c3e");
        sky.addColorStop(0.56, "#635079");
        sky.addColorStop(1, "#cf8391");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);
        stars(w, h, t);
        const moon = h * 0.16;
        ellipse(w * 0.79, h * 0.25, moon, moon, "#dea394");
        ellipse(w * 0.79, h * 0.25, moon * 0.91, moon * 0.91, "#f2bba4");
        for (let i = 0; i < 5; i++)
          line(
            w * 0.79 - moon * 0.73,
            h * 0.27 + i * moon * 0.14,
            w * 0.79 + moon * 0.73,
            h * 0.27 + i * moon * 0.14,
            "#dc9d99",
            1.5,
          );
        skyline(w, h, t);
        const gate = Math.max(54, w * 0.2),
          lanes = [h * 0.42, h * 0.76],
          scale = Math.min(h / 230, w / 440, 1.65);
        for (let lane = 0; lane < 2; lane++) {
          const y = lanes[lane],
            ink = lane ? peach : mint;
          ctx.fillStyle = lane ? "#221b34c9" : "#192439bd";
          ctx.fillRect(0, y - h * 0.057, w, h * 0.115);
          line(0, y, w, y, ink + "70", 1.3);
          ctx.save();
          ctx.translate(gate, y);
          ctx.rotate(Math.PI / 4);
          ctx.strokeStyle = ink;
          ctx.lineWidth = 2;
          ctx.strokeRect(-6 * scale, -6 * scale, 12 * scale, 12 * scale);
          ctx.restore();
        }
        const visible = phase === "ready" ? chart : notes,
          approach = 2.45;
        for (const n of visible) {
          if (n.hit) continue;
          const offset = n.time - t;
          if (offset < -0.28 || offset > approach * 1.1) continue;
          note(
            gate + (offset * (w - gate)) / approach,
            lanes[n.lane],
            Math.max(12, 13 * scale),
            n.lane,
          );
        }
        const active =
            lastHit && t - lastHit.t < 0.42 && lastHit.label !== "Miss",
          flying = active && lastHit.lane === 0,
          sled = active && lastHit.lane === 1;
        const py = flying ? lanes[0] : lanes[1] - 7 * scale;
        penguin(gate - 25 * scale, py, scale, sled, flying, t);
        if (lastHit && t - lastHit.t < 0.65) {
          const dt = t - lastHit.t;
          ctx.save();
          ctx.globalAlpha = Math.min(1, (0.65 - dt) * 5);
          ctx.font = "bold " + Math.max(14, 16 * scale) + "px system-ui";
          ctx.fillStyle =
            lastHit.label === "Miss" ? "#f8c2c6" : lastHit.lane ? peach : mint;
          ctx.textAlign = "center";
          ctx.fillText(
            lastHit.label,
            gate,
            lanes[lastHit.lane] - (17 + dt * 13) * scale,
          );
          ctx.restore();
        }
        $("meter").style.transform =
          "scaleX(" + Math.min(1, t / duration) + ")";
        $("time").textContent =
          Math.floor(t / 60) +
          ":" +
          String(Math.floor(t) % 60).padStart(2, "0");
      }
      new ResizeObserver(() =>
        draw(phase === "done" ? duration : elapsed()),
      ).observe(canvas);
      setPanel("ready");
      draw(0);
    </script>
  </body>
</html>
