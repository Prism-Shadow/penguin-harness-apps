<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Study Map</title>
    <link rel="icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header class="bar">
        <div class="brand">
          <svg
            width="25"
            height="25"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 48 48"
          >
            <rect width="48" height="48" rx="11" fill="#14644d" />
            <path
              d="M13 23h8q3 0 3-3v-5h9m-9 5v10q0 3 3 3h6"
              fill="none"
              stroke="#d5e9c9"
              stroke-width="2.4"
            />
            <rect x="8" y="18" width="11" height="10" rx="2" fill="#f3f5df" />
            <rect x="30" y="10" width="10" height="9" rx="2" fill="#d9edbc" />
            <rect
              x="30"
              y="29"
              width="10"
              height="9"
              rx="2"
              fill="#d9edbc"
            /></svg
          ><strong id="brand"></strong>
        </div>
        <div class="actions" id="reader-actions" hidden>
          <button id="home-button" type="button"></button>
          <button id="import" class="accent"></button><button id="ai"></button
          ><button id="export"></button>
        </div>
      </header>
      <section id="start" class="start">
        <form id="start-form">
          <h1><label id="start-label" for="material"></label></h1>
          <textarea id="material" rows="4" required></textarea>
          <div class="start-actions">
            <button type="submit" class="accent" id="make" disabled></button>
            <button type="button" id="more-inputs"></button>
          </div>
          <p id="start-status" role="status"></p>
        </form>
        <section aria-labelledby="examples-title">
          <h2 id="examples-title"></h2>
          <div id="examples" class="study-links"></div>
        </section>
        <section id="saved" aria-labelledby="saved-title" hidden>
          <h2 id="saved-title"></h2>
          <div id="saved-list" class="study-links"></div>
        </section>
      </section>
      <div id="reading" hidden>
        <section class="intro">
          <div class="library">
            <label for="library" id="library-label"></label
            ><select id="library"></select
            ><button id="forget" type="button" class="quiet" hidden></button>
          </div>
          <h1 id="title"></h1>
          <div class="meta">
            <span id="scope"></span><span id="revision"></span
            ><select id="mode" hidden></select>
          </div>
        </section>
        <div class="status" role="status" id="status"></div>
        <div id="reader"></div>
      </div>
    </main>
    <dialog id="dialog">
      <form method="dialog">
        <h2 id="dialog-title"></h2>
        <button value="cancel" id="dismiss">×</button>
      </form>
      <div id="dialog-content"></div>
    </dialog>
    <script src="vendor/archify.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
