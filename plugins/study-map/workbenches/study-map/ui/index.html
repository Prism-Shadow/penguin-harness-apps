<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Study Map</title>
    <link rel="icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header class="bar">
        <div class="brand">
          <img src="icon.svg" alt="" width="30" height="30" /><strong
            id="brand"
          ></strong>
        </div>
        <div class="actions">
          <button id="import"></button><button id="ai" class="accent"></button
          ><button id="export"></button>
        </div>
      </header>
      <section class="intro">
        <div class="library">
          <label for="library" id="library-label"></label
          ><select id="library"></select>
        </div>
        <h1 id="title"></h1>
        <div class="meta">
          <span id="scope"></span><span id="revision"></span
          ><select id="mode" hidden></select>
        </div>
      </section>
      <div class="status" role="status" id="status"></div>
      <div id="reader"></div>
    </main>
    <dialog id="dialog">
      <form method="dialog">
        <h2 id="dialog-title"></h2>
        <button value="cancel" id="dismiss">×</button>
      </form>
      <div id="dialog-content"></div>
    </dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
