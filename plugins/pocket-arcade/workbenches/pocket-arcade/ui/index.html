<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Pocket Arcade</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        color: #283537;
        background: #e8e5d9;
        font-size: 15px;
      }
      body {
        margin: 0;
        background: repeating-linear-gradient(
          0deg,
          #efece1 0 3px,
          #edeadd 3px 4px
        );
        min-height: 100svh;
      }
      main {
        margin: auto;
        max-width: 1100px;
        padding: clamp(13px, 3vw, 35px);
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      header,
      .line,
      .actions,
      .pad {
        display: flex;
        align-items: center;
      }
      .line,
      header {
        justify-content: space-between;
        gap: 12px;
      }
      header {
        margin-bottom: 18px;
      }
      .wordmark {
        font-size: clamp(24px, 4vw, 50px);
        letter-spacing: -0.08em;
        line-height: 1.05;
      }
      a {
        color: inherit;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #c44f35;
        outline-offset: 3px;
      }
      .games {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(195px, 100%), 1fr));
        gap: 14px;
      }
      .cart {
        background: #fcf9ef;
        border: 2px solid #404b48;
        box-shadow: 3px 4px #a0a499;
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        text-decoration: none;
        transition: transform 0.15s;
      }
      .cart:hover {
        transform: translateY(-2px);
      }
      .cart .art {
        display: grid;
        place-items: center;
        background: var(--accent);
        height: 95px;
        border-bottom: 2px solid #404b48;
      }
      .cart svg {
        height: 82px;
        width: auto;
        image-rendering: pixelated;
      }
      .cart strong,
      .cart p,
      .cart small {
        margin-inline: 12px;
      }
      .cart strong {
        font-size: 20px;
        letter-spacing: -0.05em;
        margin-top: 10px;
      }
      .cart p {
        font:
          14px/1.4 system-ui,
          sans-serif;
        margin-top: 4px;
      }
      .cart small {
        margin-top: auto;
        padding-block: 8px;
        color: #50605b;
      }
      .machine {
        max-width: 730px;
      }
      .back {
        font-size: 13px;
        text-underline-offset: 3px;
      }
      .unit {
        border-radius: 18px;
        border: 2px solid #364242;
        background: #404e4d;
        padding: clamp(8px, 2vw, 15px);
        box-shadow: 0 5px #283337;
      }
      .hud {
        color: #f6f3d8;
        padding: 1px 4px 9px;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .display {
        position: relative;
        aspect-ratio: 8/5;
        max-height: 50svh;
        min-height: 178px;
        background: #21343d;
        border: 3px solid #263539;
        border-radius: 8px;
        overflow: hidden;
        isolation: isolate;
      }
      .screen {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .grid {
        display: grid;
        position: absolute;
        inset: 6px;
        gap: 3px;
        justify-content: center;
        align-content: center;
      }
      .grid button {
        height: 100%;
        min-width: 0;
        min-height: 0;
        border: 1px solid #536a6e;
        background: #334c4c;
        color: #f1f1c9;
        border-radius: 3px;
        font:
          bold clamp(11px, 3vw, 22px)/1 ui-monospace,
          monospace;
        padding: 0;
      }
      .grid button[data-cursor="yes"] {
        outline: 2px solid #ffe3a1;
        outline-offset: -2px;
      }
      .grid button[data-tone="bright"] {
        background: #a5cf93;
        color: #243832;
      }
      .grid button[data-tone="warm"] {
        background: #f0b17a;
        color: #402f2f;
      }
      .grid button[data-tone="red"] {
        background: #c06a64;
        color: #fff;
      }
      .grid button[data-tone="dim"] {
        color: #8ba7a4;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #203338c9;
        color: #faf7df;
        text-align: center;
        padding: 12px;
      }
      .overlay div {
        padding: 13px 17px;
        max-width: 440px;
        background: #263a3d;
        border: 1px solid #8da099;
        border-radius: 7px;
      }
      .overlay h2 {
        font-size: clamp(19px, 3vw, 28px);
      }
      .overlay p {
        font:
          14px/1.4 system-ui,
          sans-serif;
        margin: 6px 0 12px;
      }
      .primary,
      .menu,
      .key {
        font-weight: 700;
        background: #f9dfa1;
        color: #283537;
        border: 1px solid #a58e62;
        border-radius: 6px;
        padding: 8px 14px;
      }
      .menu {
        background: #fbf8eb;
        border-color: #8e9a8b;
      }
      .pad {
        flex-wrap: wrap;
        justify-content: center;
        gap: 7px;
        padding: 11px 0 3px;
      }
      .key {
        color: #eff5d8;
        background: #556464;
        border: 1px solid #8b9890;
        box-shadow: 0 2px #253436;
        min-height: 42px;
        min-width: 44px;
        font:
          700 16px/1 ui-monospace,
          monospace;
        touch-action: none;
      }
      .key:active,
      .key.on {
        background: #a8c790;
        color: #283537;
      }
      .hint {
        font:
          15px/1.4 system-ui,
          sans-serif;
        margin: 13px 0;
        color: #3f514e;
      }
      .actions {
        gap: 8px;
      }
      .live {
        min-height: 18px;
        padding-top: 7px;
        text-align: center;
        color: #e9edd4;
        font-size: 13px;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 430px) {
        .games {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 9px;
        }
        .cart .art {
          height: 77px;
        }
        .cart strong {
          font-size: 16px;
        }
        .cart strong,
        .cart p,
        .cart small {
          margin-inline: 8px;
        }
        .cart p {
          font-size: 13px;
        }
        .display {
          min-height: 195px;
        }
        .machine {
          padding: 10px;
        }
        .key {
          padding: 7px 10px;
        }
        .actions .menu {
          padding: 7px;
        }
      }
      @media (max-height: 450px) and (orientation: landscape) {
        .machine {
          padding: 5px 15px;
          max-width: 740px;
        }
        .machine header {
          margin-bottom: 4px;
        }
        .wordmark {
          font-size: 24px;
        }
        .display {
          height: 51svh;
          min-height: 120px;
          max-height: none;
        }
        .pad {
          padding-top: 5px;
        }
        .key {
          min-height: 33px;
        }
        .hint {
          margin: 6px 0;
        }
        .overlay div {
          padding: 6px 12px;
        }
        .overlay p {
          margin: 4px 0;
        }
        .unit {
          padding: 5px 9px;
        }
        .hud {
          padding-bottom: 4px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1 id="title" class="wordmark">Pocket Arcade</h1>
          <p class="hint" id="sub"></p>
        </div>
      </header>
      <div class="games" id="games"></div>
    </main>
    <script>
      const games = [
        {
          id: "canal-snake",
          en: "Canal Courier",
          zh: "运河快递",
          blurb: [
            "Deliver four parcels without biting your tail.",
            "避开边墙与尾巴，送达四件包裹。",
          ],
          how: [
            "Steer with arrows or the direction pad. Each parcel lengthens the boat.",
            "用方向键或触控方向盘驾驶。每收一件包裹，船队就会变长。",
          ],
          controls: "directions",
          color: "#22856e",
          art: [
            "           ",
            "      PPP  ",
            "      P P  ",
            "  PPPPP P  ",
            "  P     P  ",
            "  PPP   P *",
            "  .BP      ",
            "           ",
          ],
        },
        {
          id: "tile-foundry",
          en: "Tile Foundry",
          zh: "数字铸造厂",
          blurb: [
            "Slide matching tiles together to forge a 32.",
            "滑动合并相同数字，铸造一个 32。",
          ],
          how: [
            "Slide the entire board with arrows, the pad or a swipe. A tile fuses only once per move.",
            "用方向键、触控方向盘或滑动移动整盘。每块每步只合并一次。",
          ],
          controls: "directions",
          color: "#bb613c",
          art: [
            "           ",
            " PPP RRR   ",
            " P.P R.R   ",
            " PPP RRR   ",
            "     PPP BB",
            "     P.P BB",
            "     PPP   ",
            "           ",
          ],
        },
        {
          id: "echo-cards",
          en: "Echo Cards",
          zh: "回声翻牌",
          blurb: [
            "Find all matching pairs in eight turns.",
            "在八轮内找齐所有对子。",
          ],
          how: [
            "Tap two cards, or move the cursor and press Enter. A mismatched pair turns back over.",
            "点两张牌，或用方向键选牌后按回车。不同的牌会重新盖住。",
          ],
          controls: "pick",
          color: "#94678e",
          art: [
            "           ",
            " PPPP RRRR ",
            " P..P R..R ",
            " P.BP R**R ",
            " P..P R..R ",
            " PPPP RRRR ",
            "           ",
            "           ",
          ],
        },
        {
          id: "cargo-shift",
          en: "Cargo Shift",
          zh: "仓库推车",
          blurb: [
            "Push both cargo cases onto the docks.",
            "把两个货箱推上泊位。",
          ],
          how: [
            "Walk with arrows, the pad, or tap an adjacent square. Push one case at a time. A case stuck in a corner ends the shift.",
            "用方向键、方向盘或点相邻格行走。一次只能推一箱，货箱在死角卡住即结束。",
          ],
          controls: "directions",
          color: "#96702e",
          art: [
            "           ",
            " PPPPRRRR  ",
            " P.BPR**R  ",
            " PPPPRRRR  ",
            "     .     ",
            " .   BBBB  ",
            " PPPPPPPP  ",
            "           ",
          ],
        },
        {
          id: "prism-break",
          en: "Prism Break",
          zh: "棱镜弹球",
          blurb: [
            "Bounce the ball through the wall of prisms.",
            "用弹板反弹球，击碎所有棱镜。",
          ],
          how: [
            "Move the paddle with left/right or drag below the ball. Break every prism before three balls fall.",
            "用左右键或拖动弹板。三颗球落空前击碎所有棱镜。",
          ],
          controls: "horizontal",
          color: "#447ca1",
          art: [
            "           ",
            " PPP RRR BB",
            " RRR BBB PP",
            " BBB PPP   ",
            "        *  ",
            "       .   ",
            "   PPPP    ",
            "           ",
          ],
        },
        {
          id: "signal-field",
          en: "Signal Field",
          zh: "信号探雷",
          blurb: [
            "Use the numbers to uncover every safe square.",
            "根据数字找出全部安全格。",
          ],
          how: [
            "Reveal a square with a tap or Enter. Numbers count adjacent mines. The Flag control marks a suspect square; the first reveal is safe.",
            "轻点或回车翻格。数字代表周围的雷数，可用旗帜标记怀疑格，首次翻格安全。",
          ],
          controls: "flags",
          color: "#707e43",
          art: [
            "           ",
            "  RRR  BBB ",
            "  RRR  B.B ",
            "  R    BBB ",
            "  P   .    ",
            " PPP  PPP  ",
            " .....PPP  ",
            "           ",
          ],
        },
        {
          id: "roof-hop",
          en: "Rooftop Relay",
          zh: "屋顶接力",
          blurb: [
            "Jump the gaps on a continuous rooftop run.",
            "跨过一连串屋顶缺口，跑到终点。",
          ],
          how: [
            "Press Space, the Jump pad or the roof to jump. Land before the next jump. Reach the striped finish sign.",
            "按空格、跳跃按钮或点游戏画面起跳。落地后才能再次跳跃，抵达条纹终点牌通关。",
          ],
          controls: "jump",
          color: "#b75d64",
          art: [
            "           ",
            "     PPP   ",
            "      BP   ",
            "    RRPP   ",
            "  .. RR    ",
            " PPPP  RRRR",
            " P..P  R..R",
            " PPPP  RRRR",
          ],
        },
        {
          id: "orbit-watch",
          en: "Orbit Watch",
          zh: "轨道守望",
          blurb: [
            "Clear the drone fleet before it reaches the relay.",
            "在无人机群降到中继站前击落它们。",
          ],
          how: [
            "Move with left/right, fire with Space. Tap a column to move there and shoot. Unlimited pulses, one shot at a time.",
            "左右移动，空格发射。点某列可移至该列并开火。脉冲不限量，一次一发。",
          ],
          controls: "shoot",
          color: "#4e739f",
          art: [
            "           ",
            " P.P  R.R  ",
            " PPP  RRR  ",
            "  P    R   ",
            "      .    ",
            "   B       ",
            "  BBB      ",
            " PBBBP     ",
          ],
        },
        {
          id: "tape-loop",
          en: "Tape Loop",
          zh: "磁带回放",
          blurb: [
            "Play back a growing pattern on four pads.",
            "在四个鼓垫上复现不断增长的序列。",
          ],
          how: [
            "Watch the lit pads, then repeat them using 1–4 or touch. Complete five rounds. A wrong note breaks the tape.",
            "观察点亮的鼓垫，再用数字 1–4 或触摸重复。完成五轮通关，按错则磁带断开。",
          ],
          controls: "tones",
          color: "#a96741",
          art: [
            "           ",
            " PPPPPPPPP ",
            " P.......P ",
            " PBB.B.RRP ",
            " PBB...RRP ",
            " P.......P ",
            " PPPPPPPPP ",
            "           ",
          ],
        },
        {
          id: "switchyard",
          en: "Switchyard",
          zh: "九宫调车场",
          blurb: [
            "Restore the numbered cars by sliding into the empty bay.",
            "利用空位滑动车厢，将编号恢复原序。",
          ],
          how: [
            "Tap a car beside the gap, or move the gap with arrows. Arrange 1–8 in reading order within 45 moves.",
            "点空位旁的车厢，或用方向键移动空位。45 步内按阅读顺序排好 1–8。",
          ],
          controls: "directions",
          color: "#418d8c",
          art: [
            "           ",
            " PP RR BB  ",
            " PP RR BB  ",
            "           ",
            " BB PP RR  ",
            " BB PP RR  ",
            "    BB PP  ",
            "    BB PP  ",
          ],
        },
      ];
      const zh = (() => {
        try {
          return (
            (window.parent !== window &&
              window.parent.document.documentElement.lang) ||
            navigator.language
          ).startsWith("zh");
        } catch {
          return navigator.language.startsWith("zh");
        }
      })();
      document.documentElement.lang = zh ? "zh" : "en";
      document.title = document.getElementById("title").textContent = zh
        ? "口袋街机厅"
        : "Pocket Arcade";
      document.getElementById("sub").textContent = zh
        ? "选一款游戏，用键盘或触屏离线游玩。"
        : "Pick a game to play offline with a keyboard or touch.";
      const legends = {
        directions: ["Arrow keys / D-pad", "方向键 / 方向盘"],
        pick: ["Enter / tap a card", "回车 / 点选"],
        flags: ["Enter, F / tap", "回车、F / 点选"],
        horizontal: ["Left, right / drag", "左右键 / 拖动"],
        jump: ["Space / tap", "空格 / 点按"],
        shoot: ["Arrows, Space / tap", "方向键、空格 / 点按"],
        tones: ["1–4 / tap a pad", "数字 1–4 / 鼓垫"],
      };
      for (const game of games) {
        const link = document.createElement("a");
        link.className = "cart";
        link.id = game.id;
        link.href = "games/" + game.id + "/index.html";
        link.style.setProperty("--accent", game.color);
        const art = document.createElement("span");
        art.className = "art";
        const ns = "http://www.w3.org/2000/svg",
          canvas = document.createElementNS(ns, "svg");
        canvas.setAttribute("viewBox", "0 0 13 10");
        canvas.setAttribute("aria-hidden", "true");
        canvas.setAttribute("shape-rendering", "crispEdges");
        const palette = {
          P: "#e2e8c7",
          R: "#f7c18e",
          B: "#243943",
          ".": "#adae91",
          "*": "#ffe79a",
        };
        game.art.forEach((line, y) =>
          [...line].forEach((c, x) => {
            if (!palette[c]) return;
            const r = document.createElementNS(ns, "rect");
            for (const [k, v] of Object.entries({
              x: x + 1,
              y: y + 1,
              width: 1,
              height: 1,
              fill: palette[c],
            }))
              r.setAttribute(k, v);
            canvas.append(r);
          }),
        );
        art.append(canvas);
        link.append(art);
        for (const [tag, value] of [
          ["strong", zh ? game.zh : game.en],
          ["p", game.blurb[zh ? 1 : 0]],
          ["small", legends[game.controls][zh ? 1 : 0]],
        ]) {
          const node = document.createElement(tag);
          node.textContent = value;
          link.append(node);
        }
        document.getElementById("games").append(link);
      }

      const returning = document.getElementById(location.hash.slice(1));
      if (returning?.classList.contains("cart")) returning.focus();
    </script>
  </body>
</html>
