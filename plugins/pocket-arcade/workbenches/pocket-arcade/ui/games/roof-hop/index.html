<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Rooftop Relay</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        color: #283537;
        background: #e8e5d9;
        font-size: 15px;
      }
      body {
        margin: 0;
        background: repeating-linear-gradient(
          0deg,
          #efece1 0 3px,
          #edeadd 3px 4px
        );
        min-height: 100svh;
      }
      main {
        margin: auto;
        max-width: 1100px;
        padding: clamp(13px, 3vw, 35px);
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      header,
      .line,
      .actions,
      .pad {
        display: flex;
        align-items: center;
      }
      .line,
      header {
        justify-content: space-between;
        gap: 12px;
      }
      header {
        margin-bottom: 18px;
      }
      .wordmark {
        font-size: clamp(24px, 4vw, 50px);
        letter-spacing: -0.08em;
        line-height: 1.05;
      }
      a {
        color: inherit;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #c44f35;
        outline-offset: 3px;
      }
      .games {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(195px, 100%), 1fr));
        gap: 14px;
      }
      .cart {
        background: #fcf9ef;
        border: 2px solid #404b48;
        box-shadow: 3px 4px #a0a499;
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        text-decoration: none;
        transition: transform 0.15s;
      }
      .cart:hover {
        transform: translateY(-2px);
      }
      .cart .art {
        display: grid;
        place-items: center;
        background: var(--accent);
        height: 95px;
        border-bottom: 2px solid #404b48;
      }
      .cart svg {
        height: 82px;
        width: auto;
        image-rendering: pixelated;
      }
      .cart strong,
      .cart p,
      .cart small {
        margin-inline: 12px;
      }
      .cart strong {
        font-size: 20px;
        letter-spacing: -0.05em;
        margin-top: 10px;
      }
      .cart p {
        font:
          14px/1.4 system-ui,
          sans-serif;
        margin-top: 4px;
      }
      .cart small {
        margin-top: auto;
        padding-block: 8px;
        color: #50605b;
      }
      .machine {
        max-width: 730px;
      }
      .back {
        font-size: 13px;
        text-underline-offset: 3px;
      }
      .unit {
        border-radius: 18px;
        border: 2px solid #364242;
        background: #404e4d;
        padding: clamp(8px, 2vw, 15px);
        box-shadow: 0 5px #283337;
      }
      .hud {
        color: #f6f3d8;
        padding: 1px 4px 9px;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .display {
        position: relative;
        aspect-ratio: 8/5;
        max-height: 50svh;
        min-height: 178px;
        background: #21343d;
        border: 3px solid #263539;
        border-radius: 8px;
        overflow: hidden;
        isolation: isolate;
      }
      .screen {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .grid {
        display: grid;
        position: absolute;
        inset: 6px;
        gap: 3px;
        justify-content: center;
        align-content: center;
      }
      .grid button {
        height: 100%;
        min-width: 0;
        min-height: 0;
        border: 1px solid #536a6e;
        background: #334c4c;
        color: #f1f1c9;
        border-radius: 3px;
        font:
          bold clamp(11px, 3vw, 22px)/1 ui-monospace,
          monospace;
        padding: 0;
      }
      .grid button[data-cursor="yes"] {
        outline: 2px solid #ffe3a1;
        outline-offset: -2px;
      }
      .grid button[data-tone="bright"] {
        background: #a5cf93;
        color: #243832;
      }
      .grid button[data-tone="warm"] {
        background: #f0b17a;
        color: #402f2f;
      }
      .grid button[data-tone="red"] {
        background: #c06a64;
        color: #fff;
      }
      .grid button[data-tone="dim"] {
        color: #8ba7a4;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #203338c9;
        color: #faf7df;
        text-align: center;
        padding: 12px;
      }
      .overlay div {
        padding: 13px 17px;
        max-width: 440px;
        background: #263a3d;
        border: 1px solid #8da099;
        border-radius: 7px;
      }
      .overlay h2 {
        font-size: clamp(19px, 3vw, 28px);
      }
      .overlay p {
        font:
          14px/1.4 system-ui,
          sans-serif;
        margin: 6px 0 12px;
      }
      .primary,
      .menu,
      .key {
        font-weight: 700;
        background: #f9dfa1;
        color: #283537;
        border: 1px solid #a58e62;
        border-radius: 6px;
        padding: 8px 14px;
      }
      .menu {
        background: #fbf8eb;
        border-color: #8e9a8b;
      }
      .pad {
        flex-wrap: wrap;
        justify-content: center;
        gap: 7px;
        padding: 11px 0 3px;
      }
      .key {
        color: #eff5d8;
        background: #556464;
        border: 1px solid #8b9890;
        box-shadow: 0 2px #253436;
        min-height: 42px;
        min-width: 44px;
        font:
          700 16px/1 ui-monospace,
          monospace;
        touch-action: none;
      }
      .key:active,
      .key.on {
        background: #a8c790;
        color: #283537;
      }
      .hint {
        font:
          15px/1.4 system-ui,
          sans-serif;
        margin: 13px 0;
        color: #3f514e;
      }
      .actions {
        gap: 8px;
      }
      .live {
        min-height: 18px;
        padding-top: 7px;
        text-align: center;
        color: #e9edd4;
        font-size: 13px;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 430px) {
        .games {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 9px;
        }
        .cart .art {
          height: 77px;
        }
        .cart strong {
          font-size: 16px;
        }
        .cart strong,
        .cart p,
        .cart small {
          margin-inline: 8px;
        }
        .cart p {
          font-size: 13px;
        }
        .display {
          min-height: 195px;
        }
        .machine {
          padding: 10px;
        }
        .key {
          padding: 7px 10px;
        }
        .actions .menu {
          padding: 7px;
        }
      }
      @media (max-height: 450px) and (orientation: landscape) {
        .machine {
          padding: 5px 15px;
          max-width: 740px;
        }
        .machine header {
          margin-bottom: 4px;
        }
        .wordmark {
          font-size: 24px;
        }
        .display {
          height: 51svh;
          min-height: 120px;
          max-height: none;
        }
        .pad {
          padding-top: 5px;
        }
        .key {
          min-height: 33px;
        }
        .hint {
          margin: 6px 0;
        }
        .overlay div {
          padding: 6px 12px;
        }
        .overlay p {
          margin: 4px 0;
        }
        .unit {
          padding: 5px 9px;
        }
        .hud {
          padding-bottom: 4px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }

      .cart .record {
        font-weight: 700;
        color: #324f47;
      }
    </style>
  </head>
  <body>
    <main class="machine">
      <header>
        <div>
          <a class="back" id="back" href="../../index.html">All games</a>
          <h1 id="title" class="wordmark"></h1>
        </div>
        <div class="actions">
          <button
            type="button"
            class="menu"
            id="sound"
            aria-pressed="true"
          ></button
          ><button type="button" class="menu" id="pause">Pause</button
          ><button type="button" class="menu" id="reset">Restart</button>
        </div>
      </header>
      <div class="unit">
        <div class="line hud">
          <b id="score"></b><time id="time">0:00</time>
        </div>
        <section class="display" id="stage" tabindex="-1">
          <canvas id="canvas" class="screen" width="320" height="200"></canvas>
          <div id="grid" class="grid" hidden></div>
          <div id="overlay" class="overlay">
            <div>
              <h2 id="heading"></h2>
              <p id="caption"></p>
              <button type="button" id="start" class="primary"></button>
            </div>
          </div>
        </section>
        <div id="pad" class="pad"></div>
        <div class="live" id="status" role="status"></div>
      </div>
      <p class="hint" id="how"></p>
    </main>
    <script>
      // All cabinets in this installed workbench share their controls and scores.
      const arcadeRoot = location.pathname
        .replace(/\/games\/[^/]+\/(?:index\.html)?$/, "/")
        .replace(/\/(?:index\.html)?$/, "");
      const recordPrefix = "penguin.pocket-arcade:" + arcadeRoot + ":";
      function readRecord(key) {
        try {
          return localStorage.getItem(recordPrefix + key);
        } catch {
          return null;
        }
      }
      function writeRecord(key, value) {
        try {
          localStorage.setItem(recordPrefix + key, String(value));
        } catch {
          // Storage may be disabled in an embedded or file-based cabinet.
        }
      }

      const info = {
        id: "roof-hop",
        en: "Rooftop Relay",
        zh: "屋顶接力",
        blurb: [
          "Carry the mail across the rooftops and collect airborne postmarks.",
          "穿过屋顶，把邮包和跃起收集的邮戳送到终点。",
        ],
        how: [
          "Jump from the gold roof edges with Space, the Jump pad or a tap. Fly through postmarks for 80 extra points and deliver the bag at the striped beacon.",
          "在屋顶金色边缘按空格、跳跃按钮或点画面起跳。空中每枚邮戳加 80 分，把邮包送到条纹信标即可通关。",
        ],
        controls: "jump",
        color: "#b75d64",
        art: [
          "           ",
          "     PPP   ",
          "      BP   ",
          "    RRPP   ",
          "  .. RR    ",
          " PPPP  RRRR",
          " P..P  R..R",
          " PPPP  RRRR",
        ],
      };
      function makeGame({
        clear,
        rect,
        pixel,
        colors,
        hint,
        end,
        showPoints,
        tone,
      }) {
        const ledges = [
          [0, 198],
          [230, 370],
          [406, 554],
          [584, 700],
          [738, 895],
          [929, 1090],
          [1126, 1320],
        ];
        const ground = 147,
          speed = 73,
          finish = 1250,
          rider = 65;
        const reducedMotion = matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        const stamps = ledges.slice(1).map(([start]) => start - 12);
        let distance, y, vy, grounded, grace, queued, landing, collected;
        function reset() {
          distance = 0;
          y = ground;
          vy = 0;
          grounded = true;
          grace = 0;
          queued = 0;
          landing = 0;
          collected = new Set();
          hint("Carry the postbag to the striped beacon", "把邮包送到条纹信标");
        }
        function takeOff() {
          grounded = false;
          grace = 0;
          queued = 0;
          landing = 0;
          // The first painted pose already leaves the roof, even between simulation frames.
          y = Math.min(y, ground) - 2;
          vy = -154;
          tone(1, 0.085);
        }
        function jump() {
          if (grounded || grace > 0) takeOff();
          else queued = 0.115;
        }
        function tick(dt) {
          const previous = y,
            wasGrounded = grounded;
          distance += speed * dt;
          vy += 335 * dt;
          y += vy * dt;
          grace = Math.max(0, grace - dt);
          queued = Math.max(0, queued - dt);
          landing = Math.max(0, landing - dt);
          const x = rider + distance;
          const roof = ledges.some(([a, b]) => x >= a && x <= b);
          grounded = roof && previous <= ground && y >= ground;
          if (grounded) {
            y = ground;
            vy = 0;
            if (!wasGrounded) {
              landing = 0.17;
              tone(0, 0.065);
            }
            if (queued > 0) takeOff();
          } else if (wasGrounded && !roof) grace = 0.085;
          for (const stamp of stamps) {
            if (
              collected.has(stamp) ||
              Math.abs(x - stamp) > 10 ||
              Math.abs(y - 16 - (ground - 35)) > 14
            )
              continue;
            collected.add(stamp);
            tone(2, 0.13);
            hint(
              "Postmarks: " + collected.size + " / " + stamps.length,
              "邮戳：" + collected.size + " / " + stamps.length,
            );
          }
          showPoints(
            Math.min(finish, Math.floor(distance)) + collected.size * 80,
            false,
          );
          if (y > 207) end(false, "Missed the roof", "错过了屋顶");
          else if (x >= finish)
            end(
              true,
              "Mail delivered · " + collected.size + " postmarks",
              "邮包送达 · " + collected.size + " 枚邮戳",
            );
        }
        const penguin = [
          "    KKKK   ",
          "   KKWWKK  ",
          "   KWKWKOO ",
          "   KWWWK   ",
          "  KKWWWKK  ",
          " RKKWWWKK  ",
          " RRKWWKK   ",
          "  RKKKK    ",
        ];
        const ink = { K: "#1e2d40", W: "#fff6dd", O: "#ffad62", R: "#db654f" };
        function draw() {
          clear();
          rect(0, 0, 320, 96, "#34475e");
          rect(0, 76, 320, 73, "#60707c");
          rect(229, 19, 18, 18, "#f4cf9b");
          rect(225, 24, 25, 9, "#f4cf9b");
          for (let i = 0; i < 10; i++) {
            const x =
              i * 41 -
              (reducedMotion ? 0 : Math.floor(distance * 0.28) % 41) -
              10;
            const h = 22 + ((i * 7) % 4) * 9;
            rect(x, 122 - h, 32, h + 25, "#405665");
            rect(x + 20, 114 - h, 2, 8, "#405665");
            for (let j = 0; j < 3; j++)
              rect(x + 4 + j * 8, 128 - h, 3, 4, "#93a39d");
          }
          for (const [a, b] of ledges) {
            const x = a - distance,
              w = b - a;
            if (x > 320 || x + w < 0) continue;
            rect(x, ground, w, 55, "#3a4551");
            rect(x, ground, w, 4, "#e78f70");
            rect(x, ground + 4, w, 3, "#aa7166");
            for (let wx = a + 10; wx < b - 6; wx += 23) {
              rect(wx - distance, 165, 8, 12, "#293a4e");
              rect(wx - distance + 1, 166, 5, 8, "#baaa86");
            }
            rect(x + w - 12, ground - 4, 8, 4, colors.gold);
          }
          for (const stamp of stamps) {
            const x = stamp - distance;
            if (x < 0 || x > 320 || collected.has(stamp)) continue;
            pixel(
              x - 5,
              ground - 40,
              [" YYYY ", "YYOOYY", "YO..OY", "YO..OY", "YYOOYY", " YYYY "],
              { Y: colors.gold, O: "#ad7154", ".": "#f3e4b8" },
              2,
            );
          }
          const post = finish - distance;
          rect(post, ground - 39, 3, 39, colors.ink);
          for (let i = 0; i < 4; i++)
            rect(
              post,
              ground - 39 + i * 3,
              17,
              3,
              i % 2 ? colors.rose : colors.gold,
            );
          const bob =
            grounded && !reducedMotion && landing === 0
              ? Math.floor(distance / 6) % 2
              : 0;
          const py = Math.round(y) - 20 + bob + (landing > 0 ? 2 : 0);
          pixel(rider - 10, py, penguin, ink, 2);
          if (grounded) {
            const stride = Math.floor(distance / 6) % 2 === 0 ? 3 : -3;
            rect(rider - 4 + stride, Math.round(y) - 3, 6, 3, ink.O);
            rect(rider + 4 - stride, Math.round(y) - 2, 6, 2, ink.O);
            if (landing > 0 && !reducedMotion) {
              rect(rider - 14, ground - 3, 3, 2, colors.ink);
              rect(rider + 13, ground - 4, 2, 2, colors.ink);
            }
          } else {
            rect(rider - 12, py + 9, 8, 3, ink.K);
            rect(rider + 8, py + 7, 6, 3, ink.K);
            rect(rider - 5, py + 16, 6, 2, ink.O);
            rect(rider + 3, py + 16, 6, 2, ink.O);
          }
        }
        return {
          reset,
          draw,
          tick,
          press(k) {
            if (k === "A") jump();
          },
          tap: jump,
        };
      }

      const $ = (id) => document.getElementById(id);
      const zh = (() => {
        try {
          return (
            (window.parent !== window &&
              window.parent.document.documentElement.lang) ||
            navigator.language
          ).startsWith("zh");
        } catch {
          return navigator.language.startsWith("zh");
        }
      })();
      const tr = (en, cn) => (zh ? cn : en);
      const name = tr(info.en, info.zh),
        words = {
          start: tr("Start game", "开始游戏"),
          again: tr("Play again", "再玩一次"),
          pause: tr("Pause", "暂停"),
          resume: tr("Resume", "继续"),
          won: tr("Game clear", "通关"),
          lost: tr("Game over", "游戏结束"),
        };
      document.title = name;
      document.documentElement.lang = zh ? "zh" : "en";
      $("title").textContent = name;
      $("back").hash = info.id;
      $("back").textContent = tr("← All games", "← 所有游戏");
      $("how").textContent = info.how[zh ? 1 : 0];
      $("pause").textContent = words.pause;
      $("reset").textContent = tr("Restart", "重开");
      const canvas = $("canvas"),
        pen = canvas.getContext("2d"),
        grid = $("grid"),
        held = new Set();
      const W = 320,
        H = 200;
      const colors = {
        dark: "#21343d",
        ink: "#eaf2cd",
        muted: "#89a6a1",
        mint: "#ade0a7",
        gold: "#fada94",
        rose: "#f19880",
        blue: "#8cc4d5",
      };
      const keys = {
        U: "↑",
        D: "↓",
        L: "←",
        R: "→",
        A: tr("Action", "操作"),
        F: tr("Flag", "旗帜"),
      };
      const maps = {
        directions: ["L", "U", "D", "R"],
        pick: ["L", "U", "D", "R", "A"],
        flags: ["L", "U", "D", "R", "A", "F"],
        horizontal: ["L", "R"],
        jump: ["A"],
        shoot: ["L", "A", "R"],
        tones: ["1", "2", "3", "4"],
      };
      if (info.controls === "jump") keys.A = tr("Jump", "跳跃");
      if (info.controls === "shoot") keys.A = tr("Fire", "发射");
      if (["pick", "flags"].includes(info.controls))
        keys.A = tr("Reveal", "翻开");
      let audio,
        soundOn = readRecord("sound") !== "off";
      const pitches = [261.63, 329.63, 392, 523.25];
      function wakeSound() {
        if (!soundOn) return;
        try {
          audio ??= new AudioContext();
          if (audio.state === "suspended") void audio.resume().catch(() => {});
        } catch {
          /* The silent controls and visual cues remain available. */
        }
      }
      function tone(index, duration = 0.16, delay = 0) {
        if (!soundOn || !audio || audio.state !== "running") return;
        const at = audio.currentTime + delay,
          wave = audio.createOscillator(),
          gain = audio.createGain();
        wave.type = "triangle";
        wave.frequency.value = pitches[index];
        gain.gain.setValueAtTime(0.001, at);
        gain.gain.exponentialRampToValueAtTime(0.13, at + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, at + duration);
        wave.connect(gain).connect(audio.destination);
        wave.onended = () => {
          wave.disconnect();
          gain.disconnect();
        };
        wave.start(at);
        wave.stop(at + duration);
      }
      function soundButton() {
        $("sound").textContent = soundOn
          ? tr("Sound on", "声音开")
          : tr("Sound off", "声音关");
        $("sound").setAttribute("aria-pressed", String(soundOn));
      }
      $("sound").onclick = () => {
        soundOn = !soundOn;
        writeRecord("sound", soundOn ? "on" : "off");
        if (soundOn) {
          wakeSound();
          tone(1);
        } else if (audio) void audio.suspend().catch(() => {});
        soundButton();
      };
      soundButton();
      let phase = "ready",
        runtime = 0,
        score = 0,
        frameId = 0,
        lastTime = 0,
        gridShape = "",
        cells = [],
        focus = 0;
      function showPoints(n, chime = true) {
        if (n === score && $("score").textContent) return;
        if (chime && n > score && info.controls !== "tones") tone(2, 0.07);
        score = n;
        $("score").textContent = tr("Score ", "得分 ") + n;
      }
      function hint(en, cn) {
        $("status").textContent = tr(en, cn);
      }
      function end(win, en, cn) {
        if (phase !== "playing") return;
        phase = "over";
        (win ? [0, 1, 2, 3] : [1, 0]).forEach((note, i) =>
          tone(note, 0.2, i * 0.11),
        );
        held.clear();
        $("overlay").hidden = false;
        $("heading").textContent = win ? words.won : words.lost;
        const previous = Number(readRecord("best:" + info.id)) || 0;
        if (score > previous) writeRecord("best:" + info.id, score);
        const best = Math.max(previous, score);
        $("caption").textContent =
          tr(en, cn) +
          " · " +
          $("score").textContent +
          (best > 0 ? " · " + tr("Best ", "最佳 ") + best : "");
        $("start").textContent = words.again;
        $("pause").disabled = true;
        if ($("replay")) $("replay").disabled = true;
        $("start").focus();
      }
      function renderGrid(cols, rows, items, selected = -1) {
        canvas.hidden = true;
        grid.hidden = false;
        const box = grid.getBoundingClientRect(),
          cell = Math.max(
            10,
            Math.floor(
              Math.min(
                (box.width - (cols - 1) * 3) / cols,
                (box.height - (rows - 1) * 3) / rows,
              ),
            ),
          );
        grid.style.gridTemplateColumns = "repeat(" + cols + ", " + cell + "px)";
        grid.style.gridTemplateRows = "repeat(" + rows + ", " + cell + "px)";
        if (gridShape !== cols + "x" + rows) {
          gridShape = cols + "x" + rows;
          grid.replaceChildren();
          cells = items.map((_, i) => {
            const b = document.createElement("button");
            b.type = "button";
            b.tabIndex = -1;
            b.onclick = () => {
              if (phase === "playing") game.cell?.(i);
            };
            grid.append(b);
            return b;
          });
        }
        items.forEach((item, i) => {
          const b = cells[i],
            v = typeof item === "string" ? { v: item } : item;
          b.textContent = v.v;
          b.dataset.tone = v.t || "";
          b.dataset.cursor = i === selected ? "yes" : "no";
          b.setAttribute(
            "aria-label",
            i + 1 + ": " + (v.label || v.v || tr("empty", "空格")),
          );
        });
      }
      function cursor(i, k, cols, rows) {
        const dx = k === "L" ? -1 : k === "R" ? 1 : 0,
          dy = k === "U" ? -1 : k === "D" ? 1 : 0;
        return (
          Math.min(rows - 1, Math.max(0, Math.floor(i / cols) + dy)) * cols +
          Math.min(cols - 1, Math.max(0, (i % cols) + dx))
        );
      }
      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }
      function rect(x, y, w, h, c) {
        pen.fillStyle = c;
        pen.fillRect(Math.round(x), Math.round(y), w, h);
      }
      function text(s, x, y, c = colors.ink, size = 12) {
        pen.font = "bold " + size + "px monospace";
        pen.fillStyle = c;
        pen.fillText(s, x, y);
      }
      function clear() {
        grid.hidden = true;
        canvas.hidden = false;
        rect(0, 0, W, H, colors.dark);
      }
      function pixel(px, py, art, palette, scale = 2) {
        art.forEach((line, y) =>
          [...line].forEach((v, x) => {
            if (palette[v])
              rect(px + x * scale, py + y * scale, scale, scale, palette[v]);
          }),
        );
      }
      function input(k) {
        if (phase !== "playing") return;
        game.press?.(k);
        game.draw?.();
      }
      for (const k of maps[info.controls]) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "key";
        b.textContent = keys[k] || k;
        b.dataset.key = k;
        b.onpointerdown = (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          b.setPointerCapture(e.pointerId);
          held.add(k);
          input(k);
        };
        b.onlostpointercapture = () => held.delete(k);
        b.onclick = (e) => {
          if (!e.detail) input(k);
        };
        $("pad").append(b);
      }
      const keyMap = {
        ArrowUp: "U",
        w: "U",
        ArrowDown: "D",
        s: "D",
        ArrowLeft: "L",
        a: "L",
        ArrowRight: "R",
        d: "R",
        Enter: "A",
        " ": "A",
        f: "F",
        1: "1",
        2: "2",
        3: "3",
        4: "4",
      };
      document.addEventListener("keydown", (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
        if (phase === "paused" && e.key === "Escape") {
          e.preventDefault();
          $("start").click();
          return;
        }
        if (phase !== "playing") return;
        if (e.key === "Escape") {
          e.preventDefault();
          pause();
          return;
        }
        const k = keyMap[e.key.length === 1 ? e.key.toLowerCase() : e.key];
        if (!k || !maps[info.controls].includes(k)) return;
        if (e.key === "Enter" || e.key === " ") {
          if (e.target.closest("button,a") && !e.target.closest("#grid"))
            return;
        }
        e.preventDefault();
        if (!held.has(k)) {
          held.add(k);
          input(k);
        }
      });
      document.addEventListener("keyup", (e) =>
        held.delete(keyMap[e.key.length === 1 ? e.key.toLowerCase() : e.key]),
      );
      function pointer(event) {
        const b = canvas.getBoundingClientRect();
        return [
          ((event.clientX - b.left) * W) / b.width,
          ((event.clientY - b.top) * H) / b.height,
        ];
      }
      let swipe = null;
      canvas.onpointerdown = (e) => {
        if (phase === "playing") {
          canvas.setPointerCapture(e.pointerId);
          game.tap?.(...pointer(e));
        }
      };
      canvas.onpointermove = (e) => {
        if (phase === "playing" && e.buttons) game.drag?.(...pointer(e));
      };
      if (info.id === "tile-foundry") grid.style.touchAction = "pinch-zoom";
      grid.onpointerdown = (e) => {
        if (info.id !== "tile-foundry" || !e.isPrimary || e.button !== 0)
          return;
        swipe = { x: e.clientX, y: e.clientY, id: e.pointerId };
        grid.setPointerCapture(e.pointerId);
      };
      grid.onpointercancel = (e) => {
        if (swipe?.id === e.pointerId) swipe = null;
      };
      grid.onpointerup = (e) => {
        if (swipe?.id !== e.pointerId) return;
        const dx = e.clientX - swipe.x,
          dy = e.clientY - swipe.y;
        swipe = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) > 15)
          input(
            Math.abs(dx) > Math.abs(dy)
              ? dx > 0
                ? "R"
                : "L"
              : dy > 0
                ? "D"
                : "U",
          );
      };
      function frame(t) {
        if (phase !== "playing") return;
        const dt = Math.min(0.05, (t - lastTime) / 1000);
        lastTime = t;
        runtime += dt;
        const seconds = Math.floor(runtime);
        if (
          seconds !== Math.floor(runtime - dt) ||
          $("time").textContent === ""
        )
          $("time").textContent =
            Math.floor(runtime / 60) +
            ":" +
            String(Math.floor(runtime) % 60).padStart(2, "0");
        game.tick?.(dt);
        if (game.tick && !canvas.hidden) game.draw?.();
        if (phase === "playing") frameId = requestAnimationFrame(frame);
      }
      function start() {
        wakeSound();
        cancelAnimationFrame(frameId);
        phase = "playing";
        runtime = 0;
        $("time").textContent = "0:00";
        held.clear();
        showPoints(0);
        hint("", "");
        $("overlay").hidden = true;
        $("pause").disabled = false;
        if ($("replay")) $("replay").disabled = false;
        game.reset();
        game.draw?.();
        $("stage").focus({ preventScroll: true });
        lastTime = performance.now();
        frameId = requestAnimationFrame(frame);
      }
      function pause() {
        if (phase !== "playing") return;
        phase = "paused";
        if (audio) void audio.suspend().catch(() => {});
        cancelAnimationFrame(frameId);
        held.clear();
        $("overlay").hidden = false;
        $("heading").textContent = words.pause;
        $("caption").textContent = $("how").textContent;
        $("start").textContent = words.resume;
        $("start").focus();
        $("pause").disabled = true;
        if ($("replay")) $("replay").disabled = true;
      }
      $("start").onclick = () => {
        if (phase !== "paused") return start();
        wakeSound();
        phase = "playing";
        $("overlay").hidden = true;
        $("pause").disabled = false;
        if ($("replay")) $("replay").disabled = false;
        lastTime = performance.now();
        $("stage").focus();
        frameId = requestAnimationFrame(frame);
      };
      $("reset").onclick = start;
      $("pause").onclick = pause;
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) pause();
      });
      const game = makeGame({
        tone,
        tr,
        hint,
        end,
        showPoints,
        renderGrid,
        cursor,
        shuffle,
        held,
        clear,
        rect,
        text,
        pixel,
        colors,
        W,
        H,
      });
      if (game.replay) {
        const replay = document.createElement("button");
        replay.disabled = true;
        replay.type = "button";
        replay.className = "key";
        replay.id = "replay";
        replay.textContent = tr("Replay phrase", "重听音序");
        replay.onclick = () => {
          if (phase === "playing") game.replay();
        };
        $("pad").append(replay);
      }
      new ResizeObserver(() => game.draw?.()).observe($("stage"));
      game.reset();
      game.draw?.();
      showPoints(0);
      $("pause").disabled = true;
      $("heading").textContent = name;
      $("caption").textContent = info.blurb[zh ? 1 : 0];
      $("start").textContent = words.start;
    </script>
  </body>
</html>
